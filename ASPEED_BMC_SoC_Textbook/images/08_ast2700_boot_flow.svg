<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">AST2700 boot chain (U-Boot docs plus device-tree evidence)</title><desc id="d">Boot flow from the RISC-V boot MCU running SPL, to the FIT image, to TF-A, OP-TEE, U-Boot and Linux on the Cortex-A35 cluster.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1240" height="520" fill="#ffffff"/><text x="620.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">AST2700 boot chain (U-Boot docs plus device-tree evidence)</text><rect x="24.0" y="70" width="206.4" height="104" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="127.2" y="110.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Reset + boot ROM</text><text x="127.2" y="125.6" font-size="12" text-anchor="middle" fill="#111827">ROM behaviour is not</text><text x="127.2" y="141.2" font-size="12" text-anchor="middle" fill="#111827">public [see ASPEED SDK]</text><rect x="270.4" y="70" width="206.4" height="104" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="373.59999999999997" y="110.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">SPL on Ibex RISC-V</text><text x="373.59999999999997" y="125.6" font-size="12" text-anchor="middle" fill="#111827">M-mode, first stage</text><text x="373.59999999999997" y="141.2" font-size="12" text-anchor="middle" fill="#111827">SPL at flash offset 0x80</text><line x1="232.39999999999998" y1="122.0" x2="268.4" y2="122.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="516.8" y="70" width="206.4" height="104" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="620.0" y="110.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">FIT image in flash</text><text x="620.0" y="125.6" font-size="12" text-anchor="middle" fill="#111827">holds 2nd-stage</text><text x="620.0" y="141.2" font-size="12" text-anchor="middle" fill="#111827">images for the A35</text><line x1="478.79999999999995" y1="122.0" x2="514.8" y2="122.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="763.2" y="70" width="206.4" height="104" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="866.4000000000001" y="110.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">TF-A BL31 + OP-TEE</text><text x="866.4000000000001" y="125.6" font-size="12" text-anchor="middle" fill="#111827">reserved RAM at</text><text x="866.4000000000001" y="141.2" font-size="12" text-anchor="middle" fill="#111827">0x4_3000_0000 / 0x4_3008_0000</text><line x1="725.2" y1="122.0" x2="761.2" y2="122.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1009.6" y="70" width="206.4" height="104" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1112.8" y="110.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">U-Boot, then Linux</text><text x="1112.8" y="125.6" font-size="12" text-anchor="middle" fill="#111827">PSCI over SMC</text><text x="1112.8" y="141.2" font-size="12" text-anchor="middle" fill="#111827">EVB console: UART12</text><line x1="971.6" y1="122.0" x2="1007.6" y2="122.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="24" y="230" width="1190" height="230" rx="10" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/><text x="34" y="246" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700">How to read the evidence</text><text x="40" y="274" font-size="12" text-anchor="start" fill="#111827">- Documented: U-Boot doc 'IBex AST2700' says AST2700 integrates an Ibex RISC-V 32-bit CPU as boot MCU to run SPL.</text><text x="40" y="304" font-size="12" text-anchor="start" fill="#111827">- Documented: SPL boots in M mode and loads the FIT image holding the 2nd-stage loaders run by the Cortex-A35.</text><text x="40" y="334" font-size="12" text-anchor="start" fill="#111827">- Documented: program u-boot-spl.bin at 0x80 bytes from the start of SPI flash.</text><text x="40" y="364" font-size="12" text-anchor="start" fill="#111827">- Inferred: reserved-memory nodes for 'trusted-firmware-a' and 'optee-core' plus PSCI/OP-TEE firmware nodes in aspeed-g7-a35.dtsi.</text><text x="40" y="394" font-size="12" text-anchor="start" fill="#111827">- Not public here: ROM behaviour, OTP layout, Caliptra's exact role in the chain. Do not guess; use ASPEED's SDK documents.</text><text x="24" y="490" font-size="11" text-anchor="start" fill="#374151">Solid border = documented in a public source. Dashed = inferred from device-tree nodes or not publicly documented.</text><text x="12" y="510" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Sources: u-boot doc/board/aspeed/ibex-ast2700.rst (commit ece349ad); Linux aspeed-g7-a35.dtsi.</text></svg>

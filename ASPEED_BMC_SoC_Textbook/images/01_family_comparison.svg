234.6" font-size="12" text-anchor="middle" fill="#111827">DDR4 1600 Mbps</text><rect x="780" y="202" width="340" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="950.0" y="234.6" font-size="12" text-anchor="middle" fill="#111827">DDR5 3200 Mbps</text><rect x="20" y="260" width="150" height="58" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="95.0" y="292.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Host-facing</text><rect x="170" y="260" width="290" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="315.0" y="284.79999999999995" font-size="12" text-anchor="middle" fill="#111827">native PCIe</text><text x="315.0" y="300.4" font-size="12" text-anchor="middle" fill="#111827">2D VGA over PCIe</text><rect x="460" y="260" width="320" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="620.0" y="284.79999999999995" font-size="12" text-anchor="middle" fill="#111827">native PCIe, 2D VGA over</text><text x="620.0" y="300.4" font-size="12" text-anchor="middle" fill="#111827">PCIe, DisplayPort 1.1a</text><rect x="780" y="260" width="340" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="950.0" y="284.79999999999995" font-size="12" text-anchor="middle" fill="#111827">PCIe Gen4, USB 3.2, DP 1.1a (2700)</text><text x="950.0" y="300.4" font-size="12" text-anchor="middle" fill="#111827">2D VGA over PCIe (2700, 2750)</text><rect x="20" y="318" width="150" height="58" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="95.0" y="350.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Security</text><rect x="170" y="318" width="290" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="315.0" y="350.59999999999997" font-size="12" text-anchor="middle" fill="#111827">not listed</text><rect x="460" y="318" width="320" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="620.0" y="342.79999999999995" font-size="12" text-anchor="middle" fill="#111827">secure boot engine</text><text x="620.0" y="358.4" font-size="12" text-anchor="middle" fill="#111827">Cortex-A7 TrustZone</text><rect x="780" y="318" width="340" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="950.0" y="342.79999999999995" font-size="12" text-anchor="middle" fill="#111827">Caliptra silicon RoT</text><text x="950.0" y="358.4" font-size="12" text-anchor="middle" fill="#111827">(secure boot engine)</text><rect x="20" y="376" width="150" height="58" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="95.0" y="408.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Storage / other</text><rect x="170" y="376" width="290" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="315.0" y="408.59999999999997" font-size="12" text-anchor="middle" fill="#111827">iKVM</text><rect x="460" y="376" width="320" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="620.0" y="408.59999999999997" font-size="12" text-anchor="middle" fill="#111827">iKVM</text><rect x="780" y="376" width="340" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="950.0" y="400.79999999999995" font-size="12" text-anchor="middle" fill="#111827">UFS 3.1, CAN 2.0B, iKVM</text><text x="950.0" y="416.4" font-size="12" text-anchor="middle" fill="#111827">LTPI 1 Gb/s (OCP DC-SCM)</text><rect x="20" y="434" width="150" height="58" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="95.0" y="466.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Process node</text><rect x="170" y="434" width="290" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="315.0" y="466.59999999999997" font-size="12" text-anchor="middle" fill="#111827">not listed</text><rect x="460" y="434" width="320" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="620.0" y="466.59999999999997" font-size="12" text-anchor="middle" fill="#111827">28 nm</text><rect x="780" y="434" width="340" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="950.0" y="466.59999999999997" font-size="12" text-anchor="middle" fill="#111827">12 nm</text><text x="20" y="516" font-size="11" text-anchor="start" fill="#374151">Source: aspeedtech.com product pages for AST2500, AST2600, AST2620, AST2700, AST2720, AST2750 (fetched 2026-10-22).</text><text x="20" y="534" font-size="11" text-anchor="start" fill="#374151">'not listed' means the product page does not say so, not that the silicon lacks the feature. RISC-V boot MCU: U-Boot ibex-ast2700 doc and Linux interrupt binding.</text><text x="12" y="550" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram for study purposes. Not an ASPEED document.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">ASPEED BMC SoC generations as listed on ASPEED's public product pages</title><desc id="d">Comparison grid of AST2500, AST2600/AST2620 and AST2700/AST2720/AST2750 covering CPU, MCU, memory, host interfaces, security and process node.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1120" height="560" fill="#ffffff"/><text x="560.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">ASPEED BMC SoC generations as listed on ASPEED's public product pages</text><rect x="170" y="50" width="290" height="36" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="315.0" y="71.89999999999999" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700">AST2500 (6th gen)</text><rect x="460" y="50" width="320" height="36" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="620.0" y="71.89999999999999" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700">AST2600 / AST2620 (7th gen)</text><rect x="780" y="50" width="340" height="36" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="950.0" y="71.89999999999999" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700">AST2700 / 2720 / 2750 (8th gen)</text><rect x="20" y="86" width="150" height="58" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="95.0" y="118.6" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Main CPU</text><rect x="170" y="86" width="290" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="315.0" y="118.6" font-size="12" text-anchor="middle" fill="#111827">Arm11 @ 800 MHz</text><rect x="460" y="86" width="32
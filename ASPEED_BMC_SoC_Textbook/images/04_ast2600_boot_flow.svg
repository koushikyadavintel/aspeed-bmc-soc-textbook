<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">AST2600 secure-boot chain (what public tools and sources show)</title><desc id="d">Boot flow from mask ROM to verified SPL, U-Boot, kernel and OpenBMC services with notes on what verifies each stage.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1180" height="470" fill="#ffffff"/><text x="590.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">AST2600 secure-boot chain (what public tools and sources show)</text><rect x="24.0" y="70" width="199.2" height="96" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="123.6" y="106.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Boot ROM</text><text x="123.6" y="121.6" font-size="12" text-anchor="middle" fill="#111827">mask ROM in the SoC</text><text x="123.6" y="137.2" font-size="12" text-anchor="middle" fill="#111827">policy comes from OTP</text><rect x="257.2" y="70" width="199.2" height="96" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="356.79999999999995" y="106.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">BL1 = U-Boot SPL</text><text x="356.79999999999995" y="121.6" font-size="12" text-anchor="middle" fill="#111827">runs from on-chip SRAM</text><text x="356.79999999999995" y="137.2" font-size="12" text-anchor="middle" fill="#111827">verified by the SoC</text><line x1="225.2" y1="118.0" x2="255.2" y2="118.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="490.4" y="70" width="199.2" height="96" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" stroke-dasharray="6 4"/><text x="590.0" y="106.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">U-Boot proper</text><text x="590.0" y="121.6" font-size="12" text-anchor="middle" fill="#111827">loaded from SPI flash</text><text x="590.0" y="137.2" font-size="12" text-anchor="middle" fill="#111827">[typical, verify]</text><line x1="458.4" y1="118.0" x2="488.4" y2="118.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="723.5999999999999" y="70" width="199.2" height="96" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" stroke-dasharray="6 4"/><text x="823.1999999999999" y="106.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Linux kernel + DTB</text><text x="823.1999999999999" y="121.6" font-size="12" text-anchor="middle" fill="#111827">usually a FIT image</text><text x="823.1999999999999" y="137.2" font-size="12" text-anchor="middle" fill="#111827">[typical, verify]</text><line x1="691.5999999999999" y1="118.0" x2="721.5999999999999" y2="118.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="956.8" y="70" width="199.2" height="96" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1056.3999999999999" y="106.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Root filesystem</text><text x="1056.3999999999999" y="121.6" font-size="12" text-anchor="middle" fill="#111827">systemd + OpenBMC</text><text x="1056.3999999999999" y="137.2" font-size="12" text-anchor="middle" fill="#111827">services</text><line x1="924.8" y1="118.0" x2="954.8" y2="118.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="24" y="210" width="1130" height="210" rx="10" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/><text x="34" y="226" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700">Facts from ASPEED's public 'socsec' secure-boot tool and README</text><text x="40" y="252" font-size="12" text-anchor="start" fill="#111827">- BL1 image (u-boot-spl.bin) is signed and 'verified by soc'; SoC ids supported: 2600, 1030, 1060.</text><text x="40" y="278" font-size="12" text-anchor="start" fill="#111827">- Default max signed SPL is 60 KB; on AST2600 A1 and later an extra 24 KB SRAM lets the region grow to 64 KB incl. a 512 B signature.</text><text x="40" y="304" font-size="12" text-anchor="start" fill="#111827">- Algorithms: RSA1024/2048/3072/4096 with SHA224/256/384/512 (PKCS#1 or PSS), ECDSA (secp384r1 keys), AES-GCM.</text><text x="40" y="330" font-size="12" text-anchor="start" fill="#111827">- Rollback prevention: --revision_id from 0 to 64. Keys and policy live in one-time-programmable (OTP) memory.</text><text x="40" y="356" font-size="12" text-anchor="start" fill="#111827">- Separate 'otptool' builds the OTP image; 'socsec verify' checks that a secure image matches an OTP image.</text><text x="40" y="382" font-size="12" text-anchor="start" fill="#111827">- AST2605 variant needs a flash-patch offset option (see README).</text><text x="24" y="445" font-size="11" text-anchor="start" fill="#374151">Solid border = documented in public sources. Dashed border = common practice that depends on your SDK or image layout.</text><text x="12" y="460" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Source: github.com/AspeedTech-BMC/socsec README; U-Boot arch/arm/mach-aspeed/ast2600.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">AST2600 functional blocks (public sources only)</title><desc id="d">Block diagram of AST2600 showing CPU subsystem, memory, security engines, bus fabric, storage, network, host interfaces and management I/O.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1120" height="720" fill="#ffffff"/><text x="560.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">AST2600 functional blocks (public sources only)</text><rect x="20" y="44" width="330" height="142" rx="10" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="60" font-size="12" text-anchor="start" fill="#2563eb" font-weight="700">CPU subsystem</text><rect x="34" y="74" width="300" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="184.0" y="92.6" font-size="12" text-anchor="middle" fill="#111827">2x Arm Cortex-A7 (DT: cpu@f00, cpu@f01)</text><rect x="34" y="110" width="300" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="184.0" y="128.6" font-size="12" text-anchor="middle" fill="#111827">GIC at 0x4046_1000 (DT: cortex-a7-gic)</text><rect x="34" y="146" width="300" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="184.0" y="164.6" font-size="12" text-anchor="middle" fill="#111827">Embedded Cortex-M3 (ASPEED product page)</text><rect x="370" y="44" width="290" height="142" rx="10" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="6 4"/><text x="380" y="60" font-size="12" text-anchor="start" fill="#0d9488" font-weight="700">Memory</text><rect x="384" y="74" width="262" height="30" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/><text x="515.0" y="92.6" font-size="12" text-anchor="middle" fill="#111827">DDR4 controller, 16-bit, 1600 Mbps</text><rect x="384" y="110" width="262" height="30" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/><text x="515.0" y="128.6" font-size="12" text-anchor="middle" fill="#111827">Controller regs 0x1E6E_0000 (EDAC node)</text><rect x="384" y="146" width="262" height="30" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/><text x="515.0" y="164.6" font-size="12" text-anchor="middle" fill="#111827">EVB DRAM window 0x8000_0000, 2 GiB</text><rect x="680" y="44" width="420" height="142" rx="10" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="690" y="60" font-size="12" text-anchor="start" fill="#dc2626" font-weight="700">Security</text><rect x="694" y="74" width="392" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="890.0" y="92.6" font-size="12" text-anchor="middle" fill="#111827">SBC secure boot controller 0x1E6F_2000</text><rect x="694" y="110" width="392" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="890.0" y="128.6" font-size="12" text-anchor="middle" fill="#111827">HACE hash + crypto engine 0x1E6D_0000</text><rect x="694" y="146" width="392" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="890.0" y="164.6" font-size="12" text-anchor="middle" fill="#111827">ACRY ECDSA/RSA accelerator 0x1E6F_A000</text><rect x="20" y="214" width="1080" height="46" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="560.0" y="241.20000000000002" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">Internal bus fabric  -  AHB controller (AHBC) at 0x1E60_0000</text><line x1="185" y1="188" x2="185" y2="212" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="515" y1="188" x2="515" y2="212" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="890" y1="188" x2="890" y2="212" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="20" y="290" width="260" height="330" rx="10" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="306" font-size="12" text-anchor="start" fill="#d97706" font-weight="700">Storage</text><rect x="30" y="322" width="240" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="150.0" y="348.3" font-size="11" text-anchor="middle" fill="#111827">FMC 0x1E62_0000 (3 chip selects)</text><rect x="30" y="378" width="240" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="150.0" y="404.3" font-size="11" text-anchor="middle" fill="#111827">SPI1 0x1E63_0000, SPI2 0x1E63_1000</text><rect x="30" y="434" width="240" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="150.0" y="460.3" font-size="11" text-anchor="middle" fill="#111827">eMMC 0x1E75_0000</text><rect x="30" y="490" width="240" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="150.0" y="516.3000000000001" font-size="11" text-anchor="middle" fill="#111827">SD/SDIO 0x1E74_0000 (2 slots)</text><rect x="30" y="546" width="240" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="150.0" y="572.3000000000001" font-size="11" text-anchor="middle" fill="#111827">SPI NOR holds BMC firmware (EVB 'bmc')</text><line x1="150.0" y1="262" x2="150.0" y2="288" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="300" y="290" width="260" height="330" rx="10" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="310" y="306" font-size="12" text-anchor="start" fill="#16a34a" font-weight="700">Network</text><rect x="310" y="322" width="240" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="430.0" y="348.3" font-size="11" text-anchor="middle" fill="#111827">4x Ethernet MAC (FTGMAC100 type)</text><rect x="310" y="378" width="240" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="430.0" y="404.3" font-size="11" text-anchor="middle" fill="#111827">0x1E66_0000 / 1E68_0000 /</text><rect x="310" y="434" width="240" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="430.0" y="460.3" font-size="11" text-anchor="middle" fill="#111827">0x1E67_0000 / 1E69_0000</text><rect x="310" y="490" width="240" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="430.0" y="516.3000000000001" font-size="11" text-anchor="middle" fill="#111827">4x MDIO at 0x1E65_0000</text><rect x="310" y="546" width="240" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="430.0" y="572.3000000000001" font-size="11" text-anchor="middle" fill="#111827">NC-SI / RGMII wiring is board-level</text><line x1="430.0" y1="262" x2="430.0" y2="288" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="580" y="290" width="260" height="330" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4"/><text x="590" y="306" font-size="12" text-anchor="start" fill="#7c3aed" font-weight="700">Host and display</text><rect x="590" y="322" width="240" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="710.0" y="348.3" font-size="11" text-anchor="middle" fill="#111827">PCIe endpoint + 2D VGA (product page)</text><rect x="590" y="378" width="240" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="710.0" y="404.3" font-size="11" text-anchor="middle" fill="#111827">GFX 1E6E_6000, Video 1E70_0000</text><rect x="590" y="434" width="240" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="710.0" y="460.3" font-size="11" text-anchor="middle" fill="#111827">LPC 0x1E78_9000: KCS x4, iBT, snoop</text><rect x="590" y="490" width="240" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="710.0" y="516.3000000000001" font-size="11" text-anchor="middle" fill="#111827">VUART x4 (0x1E78_7000..)</text><rect x="590" y="546" width="240" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="710.0" y="572.3000000000001" font-size="11" text-anchor="middle" fill="#111827">USB: vHub, UDC, EHCI x2, UHCI</text><line x1="710.0" y1="262" x2="710.0" y2="288" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="860" y="290" width="260" height="330" rx="10" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="870" y="306" font-size="12" text-anchor="start" fill="#2563eb" font-weight="700">Platform management</text><rect x="870" y="322" width="240" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="990.0" y="348.3" font-size="11" text-anchor="middle" fill="#111827">I2C x16 (0x1E78_A000, +0x80 stride)</text><rect x="870" y="378" width="240" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="990.0" y="404.3" font-size="11" text-anchor="middle" fill="#111827">I3C x6 (0x1E7A_0000) + global</text><rect x="870" y="434" width="240" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="990.0" y="460.3" font-size="11" text-anchor="middle" fill="#111827">PECI 0x1E78_B000</text><rect x="870" y="490" width="240" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="990.0" y="516.3000000000001" font-size="11" text-anchor="middle" fill="#111827">GPIO/SGPIO 0x1E78_0000</text><rect x="870" y="546" width="240" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="990.0" y="572.3000000000001" font-size="11" text-anchor="middle" fill="#111827">ADC x2, PWM/TACH, FSI x2, WDT x4, UARTs</text><line x1="990.0" y1="262" x2="990.0" y2="288" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="20" y="650" font-size="11" text-anchor="start" fill="#374151">Every address and instance count above comes from the Linux aspeed-g6.dtsi snapshot cited in the chapter; DT presence is not proof of every hardware option.</text><text x="20" y="668" font-size="11" text-anchor="start" fill="#374151">eSPI, JTAG and the PCIe root/endpoint blocks exist on AST2600 silicon but are not described by aspeed-g6.dtsi, so they are omitted here [verify against your datasheet].</text><text x="12" y="710" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram for study purposes. Not an ASPEED document.</text></svg>

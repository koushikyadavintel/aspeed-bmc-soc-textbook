<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 795" width="1000" height="795" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">AST2700 address map (from Linux aspeed-g7 device trees)</title><desc id="d">Table of AST2700 peripheral and memory addresses in SoC0, SoC1 and DRAM regions.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1000" height="795" fill="#ffffff"/><text x="500.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">AST2700 address map (from Linux aspeed-g7 device trees)</text><text x="20" y="50" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Address</text><text x="190" y="50" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Block</text><text x="420" y="50" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Notes</text><rect x="14" y="60" width="972" height="23" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="22" y="76" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_1000_0000</text><text x="190" y="76" font-size="12" text-anchor="start" fill="#111827">SRAM0</text><text x="420" y="76" font-size="11" text-anchor="start" fill="#374151">128 KiB, exported as soc0-sram</text><rect x="14" y="85" width="972" height="23" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="22" y="101" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_1201_1000</text><text x="190" y="101" font-size="12" text-anchor="start" fill="#111827">USB vHub A/B, UHCI, EHCI</text><text x="420" y="101" font-size="11" text-anchor="start" fill="#374151">vhuba1 1201_1000, vhubb1 1202_1000, uhci0 1204_0000, ehci0 1206_1000</text><rect x="14" y="110" width="972" height="23" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="22" y="126" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_1209_0000</text><text x="190" y="126" font-size="12" text-anchor="start" fill="#111827">eMMC controller</text><text x="420" y="126" font-size="11" text-anchor="start" fill="#374151">SDHCI at +0x100</text><rect x="14" y="135" width="972" height="23" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="22" y="151" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_1210_0000</text><text x="190" y="151" font-size="12" text-anchor="start" fill="#111827">INTC0</text><text x="420" y="151" font-size="11" text-anchor="start" fill="#374151">size 0x3C00</text><rect x="14" y="160" width="972" height="23" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="22" y="176" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_1220_0000</text><text x="190" y="176" font-size="12" text-anchor="start" fill="#111827">GICv3</text><text x="420" y="176" font-size="11" text-anchor="start" fill="#374151">GICD 1220_0000 (64 KiB), GICR 1228_0000 (512 KiB)</text><rect x="14" y="185" width="972" height="23" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="22" y="201" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_12C0_2000</text><text x="190" y="201" font-size="12" text-anchor="start" fill="#111827">SCU0</text><text x="420" y="201" font-size="11" text-anchor="start" fill="#374151">clocks, resets, silicon id, pinctrl0 at +0x400</text><rect x="14" y="210" width="972" height="23" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="22" y="226" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_12C1_1000</text><text x="190" y="226" font-size="12" text-anchor="start" fill="#111827">GPIO0</text><text x="420" y="226" font-size="11" text-anchor="start" fill="#374151">12 GPIOs</text><rect x="14" y="235" width="972" height="23" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="22" y="251" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_12C1_A000</text><text x="190" y="251" font-size="12" text-anchor="start" fill="#111827">UART4</text><text x="420" y="251" font-size="11" text-anchor="start" fill="#374151">ns16550a</text><rect x="14" y="260" width="972" height="23" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="22" y="276" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_12C1_C200</text><text x="190" y="276" font-size="12" text-anchor="start" fill="#111827">Mailbox 0/1</text><text x="420" y="276" font-size="11" text-anchor="start" fill="#374151">tx +0x200 rx +0x300; mbox1 at 12C1_C600</text><rect x="14" y="285" width="972" height="23" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="22" y="301" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_1400_0000</text><text x="190" y="301" font-size="12" text-anchor="start" fill="#111827">FMC + SPI0..2</text><text x="420" y="301" font-size="11" text-anchor="start" fill="#374151">FMC 1400_0000, SPI0 1401_0000, SPI1 1402_0000, SPI2 1403_0000</text><rect x="14" y="310" width="972" height="23" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="22" y="326" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_1404_0000</text><text x="190" y="326" font-size="12" text-anchor="start" fill="#111827">MDIO0..2</text><text x="420" y="326" font-size="11" text-anchor="start" fill="#374151">+0x08 stride</text><rect x="14" y="335" width="972" height="23" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="22" y="351" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0x0_1408_0000</text><text x="190" y="351" font-size="12" text-anchor="start" fill="#111827">SD controller</text><text x="420" y="351" font-size="11" text-anchor="start" fill="#374151">SDHCI at +0x100</text><rect x="14" y="360" width="972" heigh
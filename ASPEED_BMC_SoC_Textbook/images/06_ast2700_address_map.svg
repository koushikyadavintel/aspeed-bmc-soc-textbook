text x="20" y="755" font-size="12" text-anchor="start" fill="#111827">SoC0 bus: 0x1000_0000 + 0x400_0000. SoC1 bus: 0x1400_0000 + 0x2_EC00_0000, i.e. up to 0x3_0000_0000.</text><text x="12" y="785" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original table; DT 'reg' values read from aspeed-g7-a35.dtsi, soc0.dtsi, soc1.dtsi, ast2700-evb.dts.</text></svg>

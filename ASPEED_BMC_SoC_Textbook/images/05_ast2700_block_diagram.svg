<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">AST2700 processors and domains (Linux device tree + bindings + product page)</title><desc id="d">Diagram of AST2700 showing four processors, interrupt controllers, the main-domain SoC0 bus and IO-domain SoC1 bus, DRAM and external parts.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1240" height="800" fill="#ffffff"/><text x="620.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">AST2700 processors and domains (Linux device tree + bindings + product page)</text><rect x="20" y="44" width="380" height="330" rx="10" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="60" font-size="12" text-anchor="start" fill="#2563eb" font-weight="700">Four processors (INTC binding)</text><rect x="34" y="76" width="352" height="84" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="210.0" y="106.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">PSP: 4x Cortex-A35 @ 1.6 GHz</text><text x="210.0" y="121.6" font-size="12" text-anchor="middle" fill="#111827">L1 32 KiB I + 32 KiB D per core</text><text x="210.0" y="137.2" font-size="12" text-anchor="middle" fill="#111827">shared L2 512 KiB, GICv3, PSCI via SMC</text><rect x="34" y="170" width="352" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="210.0" y="193.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">SSP: Cortex-M4 @ 400 MHz</text><text x="210.0" y="209.4" font-size="12" text-anchor="middle" fill="#111827">NVIC, 128 + cascaded interrupts</text><rect x="34" y="236" width="352" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="210.0" y="259.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">TSP: Cortex-M4 @ 400 MHz</text><text x="210.0" y="275.40000000000003" font-size="12" text-anchor="middle" fill="#111827">NVIC, 128 + cascaded interrupts</text><rect x="34" y="302" width="352" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="210.0" y="328.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">BMCU: RISC-V boot MCU (Ibex, 32-bit)</text><text x="210.0" y="344.4" font-size="12" text-anchor="middle" fill="#111827">runs SPL in M-mode; APLIC for interrupts</text><rect x="430" y="44" width="250" height="330" rx="10" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/><text x="440" y="60" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700">Fabric and signalling</text><rect x="444" y="76" width="222" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="555.0" y="97.80000000000001" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">INTC0 @ 0x1210_0000</text><text x="555.0" y="113.4" font-size="12" text-anchor="middle" fill="#111827">128 inputs, routes to PSP/SSP/TSP</text><rect x="444" y="140" width="222" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="555.0" y="161.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">INTC1 @ 0x14C1_8000</text><text x="555.0" y="177.4" font-size="12" text-anchor="middle" fill="#111827">192 inputs, INTM bank outputs</text><rect x="444" y="204" width="222" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="555.0" y="225.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Mailboxes</text><text x="555.0" y="241.4" font-size="12" text-anchor="middle" fill="#111827">mbox0/1 (SoC0), mbox2 (SoC1)</text><rect x="444" y="268" width="222" height="96" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="555.0" y="296.2" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">GICv3</text><text x="555.0" y="311.8" font-size="12" text-anchor="middle" fill="#111827">GICD 0x1220_0000</text><text x="555.0" y="327.4" font-size="12" text-anchor="middle" fill="#111827">GICR 0x1228_0000</text><text x="555.0" y="343.0" font-size="12" text-anchor="middle" fill="#111827">GICC 0x4044_0000</text><rect x="710" y="44" width="510" height="330" rx="10" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="720" y="60" font-size="12" text-anchor="start" fill="#16a34a" font-weight="700">Two bus domains in the device tree</text><rect x="724" y="76" width="482" height="128" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="965.0" y="120.19999999999999" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">SoC0 'main domain'  bus @ 0x1000_0000 (64 MiB window)</text><text x="965.0" y="135.79999999999998" font-size="12" text-anchor="middle" fill="#111827">SRAM0 128 KiB, USB2 vHub A/B, EHCI, UHCI, eMMC</text><text x="965.0" y="151.39999999999998" font-size="12" text-anchor="middle" fill="#111827">INTC0, GIC, SCU0 0x12C0_2000, GPIO0 (12 pins),</text><text x="965.0" y="167.0" font-size="12" text-anchor="middle" fill="#111827">UART4, mailboxes</text><rect x="724" y="214" width="482" height="150" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="965.0" y="269.2" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">SoC1 'IO domain'  bus @ 0x1400_0000 (to 0x3_0000_0000)</text><text x="965.0" y="284.8" font-size="12" text-anchor="middle" fill="#111827">FMC + SPI0-2, MDIO0-2, SD, PWM/TACH, USB, SRAM1,</text><text x="965.0" y="300.4" font-size="12" text-anchor="middle" fill="#111827">ADC0/1, SCU1 0x14C0_2000, GPIO1, SGPIO x2, INTC1,</text><text x="965.0" y="316.0" font-size="12" text-anchor="middle" fill="#111827">UART0-3 and 5-14, WDT0-3, mailbox2, FSI x2</text><line x1="400" y1="210" x2="428" y2="210" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="680" y1="210" x2="708" y2="210" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="20" y="400" width="1200" height="190" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="416" font-size="12" text-anchor="start" fill="#7c3aed" font-weight="700">Off-chip and external connections</text><rect x="34" y="436" width="182" height="92" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/><text x="125.0" y="470.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">DDR5 3200 Mbps, 16-bit</text><text x="125.0" y="485.6" font-size="12" text-anchor="middle" fill="#111827">DRAM at 0x4_0000_0000</text><text x="125.0" y="501.2" font-size="12" text-anchor="middle" fill="#111827">(EVB: 1 GiB)</text><rect x="230" y="436" width="182" height="92" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="321.0" y="470.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">SPI NOR (FMC)</text><text x="321.0" y="485.6" font-size="12" text-anchor="middle" fill="#111827">EVB: label 'bmc' x4 mode</text><text x="321.0" y="501.2" font-size="12" text-anchor="middle" fill="#111827">flash@0..2 on FMC</text><rect x="426" y="436" width="182" height="92" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4"/><text x="517.0" y="470.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">PCIe Gen4, USB 3.2</text><text x="517.0" y="485.6" font-size="12" text-anchor="middle" fill="#111827">xHCI = DWC3 binding</text><text x="517.0" y="501.2" font-size="12" text-anchor="middle" fill="#111827">2D VGA, DP 1.1a (page)</text><rect x="622" y="436" width="182" height="92" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4"/><text x="713.0" y="470.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">UFS 3.1, CAN 2.0B</text><text x="713.0" y="485.6" font-size="12" text-anchor="middle" fill="#111827">listed on product page</text><text x="713.0" y="501.2" font-size="12" text-anchor="middle" fill="#111827">no node in DT files read</text><rect x="818" y="436" width="182" height="92" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="909.0" y="470.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">LTPI 1 Gb/s</text><text x="909.0" y="485.6" font-size="12" text-anchor="middle" fill="#111827">to DC-SCM / HPM</text><text x="909.0" y="501.2" font-size="12" text-anchor="middle" fill="#111827">or to AST1700 expander</text><rect x="1014" y="436" width="182" height="92" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1105.0" y="470.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Caliptra silicon RoT</text><text x="1105.0" y="485.6" font-size="12" text-anchor="middle" fill="#111827">OCP open RoT IP</text><text x="1105.0" y="501.2" font-size="12" text-anchor="middle" fill="#111827">(product page)</text><text x="34" y="556" font-size="11" text-anchor="start" fill="#374151">Dashed = stated on ASPEED's product page but not described in the mainline device-tree files I read.</text><text x="20" y="620" font-size="12" text-anchor="start" fill="#111827">Bus domains: the DT calls SoC0 'Main Domain peripherals'; the interrupt binding places INTC1 'on the SoC's IO die'.</text><text x="20" y="640" font-size="12" text-anchor="start" fill="#111827">That is where the two-domain split comes from. ASPEED's product page does not describe die count, so treat 'die' as binding vocabulary.</text><text x="20" y="672" font-size="12" text-anchor="start" fill="#111827">Peripheral addresses and counts are from aspeed-g7-a35.dtsi, aspeed-g7-soc0.dtsi and aspeed-g7-soc1.dtsi.</text><text x="20" y="692" font-size="12" text-anchor="start" fill="#111827">Mainline Linux did not yet describe I2C, I3C, Ethernet, eSPI or PCIe nodes for AST2700 in those files at the snapshot used.</text><text x="12" y="790" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Sources: torvalds/linux commit 7be4bc52 (2026-10-22); aspeedtech.com AST2700 page; u-boot ibex-ast2700 doc.</text></svg>

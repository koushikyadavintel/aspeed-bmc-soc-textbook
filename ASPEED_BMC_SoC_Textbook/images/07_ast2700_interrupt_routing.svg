<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 810" width="1180" height="810" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">AST2700 interrupt routing (INTC0 ranges in the Linux device tree)</title><desc id="d">How INTC0 hardware interrupt ranges are routed to the GIC of the Cortex-A35 cluster and to the SSP and TSP Cortex-M4 NVICs, with INTC1 feeding INTC0.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1180" height="810" fill="#ffffff"/><text x="590.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">AST2700 interrupt routing (INTC0 ranges in the Linux device tree)</text><rect x="30" y="56" width="240" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="150.0" y="82.80000000000001" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Peripherals (SoC0)</text><text x="150.0" y="98.4" font-size="12" text-anchor="middle" fill="#111827">feed INTC0 inputs 0..127</text><rect x="30" y="140" width="240" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="150.0" y="166.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">INTC1(0) in the IO domain</text><text x="150.0" y="182.4" font-size="12" text-anchor="middle" fill="#111827">192 local inputs, INTM banks</text><rect x="30" y="224" width="240" height="62" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="150.0" y="250.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">INTC1(1), INTC1(2)</text><text x="150.0" y="266.40000000000003" font-size="12" text-anchor="middle" fill="#111827">optional, attached via LTPI</text><rect x="400" y="120" width="250" height="100" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="525.0" y="150.20000000000002" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">INTC0 router</text><text x="525.0" y="165.8" font-size="12" text-anchor="middle" fill="#111827">inputs: 128 local + INTM fan-in</text><text x="525.0" y="181.40000000000003" font-size="12" text-anchor="middle" fill="#111827">outputs to PSP, SSP, TSP</text><text x="525.0" y="197.00000000000003" font-size="12" text-anchor="middle" fill="#111827">software-interrupt outputs</text><line x1="270" y1="87" x2="400" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><line x1="270" y1="171" x2="400" y2="170" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><line x1="270" y1="255" x2="400" y2="190" stroke="#374151" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="800" y="56" width="350" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="975.0" y="81.80000000000001" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">PSP GIC (A35, GICv3)</text><text x="975.0" y="97.4" font-size="12" text-anchor="middle" fill="#111827">SPI 0-127 plus software-int and INTM ranges</text><rect x="800" y="140" width="350" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="975.0" y="165.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">SSP NVIC (Cortex-M4)</text><text x="975.0" y="181.4" font-size="12" text-anchor="middle" fill="#111827">own 128 lines + cascades</text><rect x="800" y="224" width="350" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="975.0" y="249.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">TSP NVIC (Cortex-M4)</text><text x="975.0" y="265.40000000000003" font-size="12" text-anchor="middle" fill="#111827">own 128 lines + cascades</text><rect x="800" y="308" width="350" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="975.0" y="329.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">BMCU APLIC (RISC-V boot MCU)</text><text x="975.0" y="345.4" font-size="12" text-anchor="middle" fill="#111827">fed directly from INTC1 banks</text><line x1="650" y1="135" x2="800" y2="86" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><line x1="650" y1="170" x2="800" y2="170" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><line x1="650" y1="205" x2="800" y2="254" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="270,150 335,150 335,334 800,334" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="30" y="388" font-size="13" text-anchor="start" fill="#111827" font-weight="700">INTC0 'aspeed,interrupt-ranges' as written in aspeed-g7-soc0.dtsi (hwirq start, count -&gt; target, target line):</text><text x="30" y="416" font-size="12" text-anchor="start" fill="#111827" font-weight="700">INTC0 hwirq</text><text x="200" y="416" font-size="12" text-anchor="start" fill="#111827" font-weight="700">count</text><text x="280" y="416" font-size="12" text-anchor="start" fill="#111827" font-weight="700">target</text><text x="480" y="416" font-size="12" text-anchor="start" fill="#111827" font-weight="700">meaning</text><rect x="24" y="422" width="1130" height="22" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="30" y="437" font-size="12" text-anchor="start" fill="#111827" font-weight="700">0 .. 127</text><text x="200" y="437" font-size="12" text-anchor="start" fill="#111827">128</text><text x="280" y="437" font-size="12" text-anchor="start" fill="#111827">GIC SPI 0 ..</text><text x="480" y="437" font-size="12" text-anchor="start" fill="#374151">linear 1:1</text><rect x="24" y="446" width="1130" height="22" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="30" y="461" font-size="12" text-anchor="start" fill="#111827" font-weight="700">144 .. 151</text><text x="200" y="461" font-size="12" text-anchor="start" fill="#111827">8</text><text x="280" y="461" font-size="12" text-anchor="start" fill="#111827">GIC SPI 144 ..</text><text x="480" y="461" font-size="12" text-anchor="start" fill="#374151">software interrupt, SSP</text><rect x="24" y="470" width="1130" height="22" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="30" y="485" font-size="12" text-anchor="start" fill="#111827" font-weight="700">152 .. 159</text><text x="200" y="485" font-size="12" text-anchor="start" fill="#111827">8</text><text x="280" y="485" font-size="12" text-anchor="start" fill="#111827">GIC SPI 152 ..</text><text x="480" y="485" font-size="12" text-anchor="start" fill="#374151">software interrupt, TSP</text><rect x="24" y="494" width="1130" height="22" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="30" y="509" font-size="12" text-anchor="start" fill="#111827" font-weight="700">192 .. 201</text><text x="200" y="509" font-size="12" text-anchor="start" fill="#111827">10</text><text x="280" y="509" font-size="12" text-anchor="start" fill="#111827">GIC SPI 192 ..</text><text x="480" y="509" font-size="12" text-anchor="start" fill="#374151">INTM M0-M9</text><rect x="24" y="518" width="1130" height="22" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="30" y="533" font-size="12" text-anchor="start" fill="#111827" font-weight="700">208 .. 217</text><text x="200" y="533" font-size="12" text-anchor="start" fill="#111827">10</text><text x="280" y="533" font-size="12" text-anchor="start" fill="#111827">GIC SPI 208 ..</text><text x="480" y="533" font-size="12" text-anchor="start" fill="#374151">INTM M30-M39</text><rect x="24" y="542" width="1130" height="22" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="30" y="557" font-size="12" text-anchor="start" fill="#111827" font-weight="700">224 .. 233</text><text x="200" y="557" font-size="12" text-anchor="start" fill="#111827">10</text><text x="280" y="557" font-size="12" text-anchor="start" fill="#111827">GIC SPI 224 ..</text><text x="480" y="557" font-size="12" text-anchor="start" fill="#374151">INTM M40-M49</text><rect x="24" y="566" width="1130" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="30" y="581" font-size="12" text-anchor="start" fill="#111827" font-weight="700">256 .. 383</text><text x="200" y="581" font-size="12" text-anchor="start" fill="#111827">128</text><text x="280" y="581" font-size="12" text-anchor="start" fill="#111827">SSP NVIC 0 ..</text><text x="480" y="581" font-size="12" text-anchor="start" fill="#374151">linear to SSP</text><rect x="24" y="590" width="1130" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="30" y="605" font-size="12" text-anchor="start" fill="#111827" font-weight="700">384 .. 393</text><text x="200" y="605" font-size="12" text-anchor="start" fill="#111827">10</text><text x="280" y="605" font-size="12" text-anchor="start" fill="#111827">SSP NVIC 160 ..</text><text x="480" y="605" font-size="12" text-anchor="start" fill="#374151">cascaded via M10-M19</text><rect x="24" y="614" width="1130" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="30" y="629" font-size="12" text-anchor="start" fill="#111827" font-weight="700">400 .. 407</text><text x="200" y="629" font-size="12" text-anchor="start" fill="#111827">8</text><text x="280" y="629" font-size="12" text-anchor="start" fill="#111827">SSP NVIC 144 ..</text><text x="480" y="629" font-size="12" text-anchor="start" fill="#374151">software interrupt, PSP</text><rect x="24" y="638" width="1130" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="30" y="653" font-size="12" text-anchor="start" fill="#111827" font-weight="700">408 .. 415</text><text x="200" y="653" font-size="12" text-anchor="start" fill="#111827">8</text><text x="280" y="653" font-size="12" text-anchor="start" fill="#111827">SSP NVIC 152 ..</text><text x="480" y="653" font-size="12" text-anchor="start" fill="#374151">software interrupt, TSP</text><rect x="24" y="662" width="1130" height="22" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="30" y="677" font-size="12" text-anchor="start" fill="#111827" font-weight="700">426 .. 553</text><text x="200" y="677" font-size="12" text-anchor="start" fill="#111827">128</text><text x="280" y="677" font-size="12" text-anchor="start" fill="#111827">TSP NVIC 0 ..</text><text x="480" y="677" font-size="12" text-anchor="start" fill="#374151">linear to TSP</text><rect x="24" y="686" width="1130" height="22" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="30" y="701" font-size="12" text-anchor="start" fill="#111827" font-weight="700">554 .. 563</text><text x="200" y="701" font-size="12" text-anchor="start" fill="#111827">10</text><text x="280" y="701" font-size="12" text-anchor="start" fill="#111827">TSP NVIC 160 ..</text><text x="480" y="701" font-size="12" text-anchor="start" fill="#374151">cascaded via M20-M29</text><rect x="24" y="710" width="1130" height="22" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="30" y="725" font-size="12" text-anchor="start" fill="#111827" font-weight="700">570 .. 577</text><text x="200" y="725" font-size="12" text-anchor="start" fill="#111827">8</text><text x="280" y="725" font-size="12" text-anchor="start" fill="#111827">TSP NVIC 144 ..</text><text x="480" y="725" font-size="12" text-anchor="start" fill="#374151">software interrupt, PSP</text><rect x="24" y="734" width="1130" height="22" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="30" y="749" font-size="12" text-anchor="start" fill="#111827" font-weight="700">578 .. 585</text><text x="200" y="749" font-size="12" text-anchor="start" fill="#111827">8</text><text x="280" y="749" font-size="12" text-anchor="start" fill="#111827">TSP NVIC 152 ..</text><text x="480" y="749" font-size="12" text-anchor="start" fill="#374151">software interrupt, TSP</text><text x="12" y="800" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Sources: Linux aspeed,ast2700-interrupt.yaml and aspeed-g7-soc0.dtsi at commit 7be4bc52. Check ranges against your kernel.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">DC-SCM 2.x form factors and connector mounting (schematic, not to scale)</title><desc id="d">Plan-view sketches of the horizontal external, horizontal internal and vertical DC-SCM form factors and side-view sketches of straddle mount, right angle and vertical connectors.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1240" height="760" fill="#ffffff"/><text x="620.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">DC-SCM 2.x form factors and connector mounting (schematic, not to scale)</text><rect x="20" y="44" width="390" height="330" rx="10" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="60" font-size="12" text-anchor="start" fill="#2563eb" font-weight="700">HFF - External (EFF)</text><rect x="60" y="100" width="300" height="190" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="60" y="100" width="24" height="190" rx="2" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="72" y="200" font-size="11" text-anchor="middle" fill="#ffffff">faceplate</text><text x="72" y="200" font-size="11" text-anchor="middle" fill="#ffffff" transform="rotate(-90 72 195)">faceplate</text><rect x="336" y="130" width="24" height="130" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="348" y="200" font-size="10" text-anchor="middle" fill="#111827" font-weight="700">4C+</text><rect x="110" y="130" width="190" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="205.0" y="155.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">DC-SCM PCB</text><text x="205.0" y="171.4" font-size="12" text-anchor="middle" fill="#111827">1.57 mm thick</text><text x="110" y="222" font-size="11" text-anchor="start" fill="#111827">pull tab + captive fastener</text><text x="110" y="240" font-size="11" text-anchor="start" fill="#111827">EMI: finger stock or FoF gasket</text><text x="110" y="258" font-size="11" text-anchor="start" fill="#111827">front or rear of chassis</text><text x="40" y="330" font-size="11" text-anchor="start" fill="#111827">Similar to OCP NIC 3.0 but longer and wider,</text><text x="40" y="348" font-size="11" text-anchor="start" fill="#111827">so it cannot mate into a NIC 3.0 slot.</text><rect x="430" y="44" width="390" height="330" rx="10" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="440" y="60" font-size="12" text-anchor="start" fill="#16a34a" font-weight="700">HFF - Internal (IFF)</text><rect x="470" y="100" width="300" height="190" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><rect x="746" y="130" width="24" height="130" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="758" y="200" font-size="10" text-anchor="middle" fill="#111827" font-weight="700">4C+</text><rect x="470" y="100" width="18" height="190" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="479" y="200" font-size="10" text-anchor="start" fill="#111827"></text><rect x="515" y="130" width="190" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="610.0" y="155.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">DC-SCM PCB</text><text x="610.0" y="171.4" font-size="12" text-anchor="middle" fill="#111827">same board outline as EFF</text><text x="500" y="222" font-size="11" text-anchor="start" fill="#111827">slots on sides for module guide rails</text><text x="500" y="240" font-size="11" text-anchor="start" fill="#111827">optional vertical rear handle</text><text x="500" y="258" font-size="11" text-anchor="start" fill="#111827">I/O by cable and/or faceplate</text><text x="450" y="330" font-size="11" text-anchor="start" fill="#111827">No front/rear wall interface required;</text><text x="450" y="348" font-size="11" text-anchor="start" fill="#111827">overall dimensions identical to EFF.</text><rect x="840" y="44" width="380" height="330" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4"/><text x="850" y="60" font-size="12" text-anchor="start" fill="#7c3aed" font-weight="700">VFF - Vertical (new in 2.1)</text><rect x="880" y="100" width="60" height="240" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><rect x="960" y="100" width="60" height="170" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="910" y="360" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">Long</text><text x="990" y="290" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">Short</text><text x="1040" y="130" font-size="11" text-anchor="start" fill="#111827">2U or taller servers</text><text x="1040" y="150" font-size="11" text-anchor="start" fill="#111827">like a PCIe add-in card</text><text x="1040" y="180" font-size="11" text-anchor="start" fill="#111827">Type 1 bracket: flush</text><text x="1040" y="198" font-size="11" text-anchor="start" fill="#111827">against chassis wall</text><text x="1040" y="226" font-size="11" text-anchor="start" fill="#111827">Type 2: low-profile-PCIe</text><text x="1040" y="244" font-size="11" text-anchor="start" fill="#111827">style bracket</text><text x="1040" y="272" font-size="11" text-anchor="start" fill="#111827">optional rear bracket</text><text x="1040" y="300" font-size="11" text-anchor="start" fill="#111827">same DC-SCI as HFF</text><rect x="20" y="400" width="1200" height="310" rx="10" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="416" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700">Connector mounting options on the HPM (side views)</text><text x="170" y="436" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Straddle mount</text><rect x="40" y="500" width="120" height="14" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="190" y="500" width="110" height="14" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="140" y="486" width="70" height="42" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="100" y="560" font-size="11" text-anchor="middle" fill="#111827">HPM PCB</text><text x="245" y="560" font-size="11" text-anchor="middle" fill="#111827">SCM PCB</text><text x="40" y="590" font-size="11" text-anchor="start" fill="#111827">SCM PCB 1.57 mm; HPM 1.57-2.79 mm</text><text x="40" y="608" font-size="11" text-anchor="start" fill="#111827">co-planar except 0.076 in HPM: -0.3 mm</text><text x="40" y="626" font-size="11" text-anchor="start" fill="#111827">five PCB-thickness options A-E</text><text x="580" y="436" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Right angle</text><rect x="450" y="500" width="120" height="14" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="600" y="470" width="110" height="14" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="550" y="486" width="70" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="510" y="560" font-size="11" text-anchor="middle" fill="#111827">HPM PCB</text><text x="655" y="454" font-size="11" text-anchor="middle" fill="#111827">SCM PCB (raised)</text><text x="450" y="590" font-size="11" text-anchor="start" fill="#111827">constant 4.05 mm offset for all</text><text x="450" y="608" font-size="11" text-anchor="start" fill="#111827">HPM thicknesses; allows larger</text><text x="450" y="626" font-size="11" text-anchor="start" fill="#111827">SCM bottom keep-out</text><text x="980" y="436" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Vertical</text><rect x="850" y="500" width="120" height="14" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="1010" y="440" width="14" height="70" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="978" y="480" width="70" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="910" y="560" font-size="11" text-anchor="middle" fill="#111827">HPM PCB</text><text x="1080" y="470" font-size="11" text-anchor="middle" fill="#111827">SCM upright</text><text x="850" y="590" font-size="11" text-anchor="start" fill="#111827">for the vertical form factor</text><text x="850" y="608" font-size="11" text-anchor="start" fill="#111827">(VFF), SCM stands upright</text><text x="850" y="626" font-size="11" text-anchor="start" fill="#111827">relative to the HPM</text><text x="12" y="750" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original sketch. Dimensions quoted only where the OCP DC-SCM Rev 2.1 text states them (sections 2.2-2.3, 3.3). See spec figures for drawings.</text></svg>

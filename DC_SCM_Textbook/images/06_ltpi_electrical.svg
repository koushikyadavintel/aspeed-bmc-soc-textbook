<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">LTPI physical layer: four unidirectional AC-coupled LVDS links</title><desc id="d">Electrical diagram of one LTPI LVDS link with driver, series DC-blocking capacitors, bias and termination network, and receiver, plus a table of the four links.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1200" height="620" fill="#ffffff"/><text x="600.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">LTPI physical layer: four unidirectional AC-coupled LVDS links</text><rect x="20" y="44" width="340" height="260" rx="10" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="60" font-size="12" text-anchor="start" fill="#2563eb" font-weight="700">Transmitter (SCM or HPM CPLD/FPGA)</text><rect x="60" y="130" width="120" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="120.0" y="158.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">LVDS TX</text><text x="120.0" y="173.6" font-size="12" text-anchor="middle" fill="#111827">driver</text><text x="120.0" y="189.2" font-size="12" text-anchor="middle" fill="#111827">VOD 100-800 mV</text><rect x="840" y="44" width="340" height="260" rx="10" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="850" y="60" font-size="12" text-anchor="start" fill="#16a34a" font-weight="700">Receiver (other CPLD/FPGA)</text><rect x="1000" y="130" width="130" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="1065.0" y="158.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">LVDS RX</text><text x="1065.0" y="173.6" font-size="12" text-anchor="middle" fill="#111827">buffer</text><text x="1065.0" y="189.2" font-size="12" text-anchor="middle" fill="#111827">VID 100-800 mV</text><line x1="180" y1="150" x2="400" y2="150" stroke="#374151" stroke-width="1.6"/><line x1="180" y1="190" x2="400" y2="190" stroke="#374151" stroke-width="1.6"/><text x="300" y="140" font-size="11" text-anchor="middle" fill="#111827">P  (Z0 85 ohm diff nominal)</text><text x="300" y="210" font-size="11" text-anchor="middle" fill="#111827">N</text><rect x="400" y="138" width="30" height="24" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><rect x="400" y="178" width="30" height="24" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="415" y="126" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">0.22 uF</text><text x="415" y="224" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">0.22 uF</text><line x1="430" y1="150" x2="640" y2="150" stroke="#374151" stroke-width="1.6"/><line x1="430" y1="190" x2="640" y2="190" stroke="#374151" stroke-width="1.6"/><line x1="640" y1="150" x2="700" y2="150" stroke="#374151" stroke-width="1.6"/><rect x="700" y="138" width="70" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="735" y="155" font-size="11" text-anchor="middle" fill="#111827">50 ohm</text><line x1="770" y1="150" x2="800" y2="150" stroke="#374151" stroke-width="1.6"/><line x1="800" y1="150" x2="800" y2="190" stroke="#374151" stroke-width="1.6"/><line x1="800" y1="190" x2="770" y2="190" stroke="#374151" stroke-width="1.6"/><rect x="700" y="178" width="70" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="735" y="195" font-size="11" text-anchor="middle" fill="#111827">50 ohm</text><line x1="640" y1="190" x2="700" y2="190" stroke="#374151" stroke-width="1.6"/><line x1="735" y1="150" x2="735" y2="120" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="735" y1="202" x2="735" y2="250" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4"/><text x="735" y="112" font-size="11" text-anchor="middle" fill="#111827">VCCIO RX via 1k</text><text x="735" y="266" font-size="11" text-anchor="middle" fill="#111827">GND via 1k; 0.1 uF at the center node</text><line x1="800" y1="170" x2="998" y2="170" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><text x="900" y="160" font-size="11" text-anchor="middle" fill="#111827">to RX pair</text><text x="20" y="330" font-size="14" text-anchor="start" fill="#111827" font-weight="700">Rules from the specification (the drawn network illustrates Fig. 59 values; see the spec for the exact circuit)</text><text x="30" y="354" font-size="12" text-anchor="start" fill="#111827">- DC-blocking capacitor (CDC) sits on the DC-SCM module, 0.22 uF, derived from the LTPI base frequency and training needs.</text><text x="30" y="376" font-size="12" text-anchor="start" fill="#111827">- Voltage-bias circuit sits close to each RX buffer; all four links need one (two on the SCM, two on the HPM).</text><text x="30" y="398" font-size="12" text-anchor="start" fill="#111827">- Termination 100 ohm +/-5% (external or integrated); adjust to the device's RX requirements. Differential Z0 nominal 85 ohm.</text><text x="30" y="420" font-size="12" text-anchor="start" fill="#111827">- The bias network drawn above is only an example. Always follow the CPLD/FPGA datasheet for common-mode requirements.</text><text x="20" y="468" font-size="14" text-anchor="start" fill="#111827" font-weight="700">The four links (8 CPLD/FPGA pins)</text><text x="30" y="492" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Link</text><text x="330" y="492" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Lanes</text><text x="520" y="492" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Direction</text><text x="760" y="492" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Role</text><rect x="24" y="498" width="1150" height="22" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="30" y="514" font-size="12" text-anchor="start" fill="#111827">LTPI_HPM_SCM_DATA</text><text x="330" y="514" font-size="12" text-anchor="start" fill="#111827">DP / DN</text><text x="520" y="514" font-size="12" text-anchor="start" fill="#111827">HPM TX -&gt; SCM RX</text><text x="760" y="514" font-size="12" text-anchor="start" fill="#111827">payload frames</text><rect x="24" y="522" width="1150" height="22" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="30" y="538" font-size="12" text-anchor="start" fill="#111827">LTPI_HPM_SCM_CLK</text><text x="330" y="538" font-size="12" text-anchor="start" fill="#111827">DP / DN</text><text x="520" y="538" font-size="12" text-anchor="start" fill="#111827">HPM TX -&gt; SCM RX</text><text x="760" y="538" font-size="12" text-anchor="start" fill="#111827">forwarded clock</text><rect x="24" y="546" width="1150" height="22" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="30" y="562" font-size="12" text-anchor="start" fill="#111827">LTPI_SCM_HPM_DATA</text><text x="330" y="562" font-size="12" text-anchor="start" fill="#111827">DP / DN</text><text x="520" y="562" font-size="12" text-anchor="start" fill="#111827">SCM TX -&gt; HPM RX</text><text x="760" y="562" font-size="12" text-anchor="start" fill="#111827">payload frames</text><rect x="24" y="570" width="1150" height="22" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="30" y="586" font-size="12" text-anchor="start" fill="#111827">LTPI_SCM_HPM_CLK</text><text x="330" y="586" font-size="12" text-anchor="start" fill="#111827">DP / DN</text><text x="520" y="586" font-size="12" text-anchor="start" fill="#111827">SCM TX -&gt; HPM RX</text><text x="760" y="586" font-size="12" text-anchor="start" fill="#111827">forwarded clock</text><text x="12" y="610" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Source: OCP DC-SCM Rev 2.1 v1.1 section 3.5.6, Tables 3-4, Figs. 57-59.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Three ways ASPEED BMCs reach a DC-SCM 2.x HPM</title><desc id="d">Three architecture options: AST2600 with an external SCM CPLD providing LTPI, AST2700 with integrated LTPI, and AST2700 with an AST1700 I/O expander over LTPI.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1240" height="700" fill="#ffffff"/><text x="620.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">Three ways ASPEED BMCs reach a DC-SCM 2.x HPM</text><rect x="20" y="44" width="1200" height="190" rx="10" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="60" font-size="12" text-anchor="start" fill="#2563eb" font-weight="700">A. AST2600 class BMC + external SCM CPLD/FPGA</text><rect x="40.0" y="84" width="260.0" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="170.0" y="117.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">AST2600</text><text x="170.0" y="132.6" font-size="12" text-anchor="middle" fill="#111827">no LTPI listed on</text><text x="170.0" y="148.2" font-size="12" text-anchor="middle" fill="#111827">product page</text><rect x="340.0" y="84" width="260.0" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="470.0" y="117.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">SCM CPLD / FPGA</text><text x="470.0" y="132.6" font-size="12" text-anchor="middle" fill="#111827">LTPI IP (e.g. OCP reference</text><text x="470.0" y="148.2" font-size="12" text-anchor="middle" fill="#111827">design on a MAX 10)</text><line x1="302.0" y1="129" x2="338.0" y2="129" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="640.0" y="84" width="260.0" height="90" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="770.0" y="124.80000000000001" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">DC-SCI LTPI</text><text x="770.0" y="140.4" font-size="12" text-anchor="middle" fill="#ffffff">4 LVDS links, 8 pins</text><line x1="602.0" y1="129" x2="638.0" y2="129" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="940.0" y="84" width="260.0" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="1070.0" y="117.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">HPM FPGA</text><text x="1070.0" y="132.6" font-size="12" text-anchor="middle" fill="#111827">LTPI target + power</text><text x="1070.0" y="148.2" font-size="12" text-anchor="middle" fill="#111827">sequencing</text><line x1="902.0" y1="129" x2="938.0" y2="129" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="40" y="200" font-size="12" text-anchor="start" fill="#111827">BMC talks to the CPLD over its own buses; the CPLD tunnels low-speed signals. LTPI spec Fig. 1: 'LVDS connection to SCM CPLD'.</text><rect x="20" y="250" width="1200" height="190" rx="10" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="266" font-size="12" text-anchor="start" fill="#16a34a" font-weight="700">B. AST2700 class BMC with integrated LTPI</text><rect x="40.0" y="290" width="360.0" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="220.0" y="323.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">AST2700 / 2720 / 2750</text><text x="220.0" y="338.6" font-size="12" text-anchor="middle" fill="#111827">'integrates the LTPI</text><text x="220.0" y="354.2" font-size="12" text-anchor="middle" fill="#111827">interface'</text><rect x="440.0" y="290" width="360.0" height="90" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="620.0" y="323.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">DC-SCI LTPI</text><text x="620.0" y="338.6" font-size="12" text-anchor="middle" fill="#ffffff">direct LVDS from BMC</text><text x="620.0" y="354.2" font-size="12" text-anchor="middle" fill="#ffffff">(LTPI spec Fig. 2)</text><line x1="402.0" y1="335" x2="438.0" y2="335" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="840.0" y="290" width="360.0" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="1020.0" y="330.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">HPM FPGA</text><text x="1020.0" y="346.4" font-size="12" text-anchor="middle" fill="#111827">LTPI target</text><line x1="802.0" y1="335" x2="838.0" y2="335" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="40" y="406" font-size="12" text-anchor="start" fill="#111827">ASPEED says this simplifies DC-SCM designs. A board can still add a CPLD for other glue logic and muxing.</text><rect x="20" y="456" width="1200" height="190" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="472" font-size="12" text-anchor="start" fill="#7c3aed" font-weight="700">C. AST2700 + AST1700 I/O expander over LTPI</text><rect x="40.0" y="496" width="260.0" height="90" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="170.0" y="536.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">AST2700 BMC</text><text x="170.0" y="552.4" font-size="12" text-anchor="middle" fill="#111827">LTPI controller</text><rect x="340.0" y="496" width="260.0" height="90" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="470.0" y="536.8" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">LTPI 1 Gb/s</text><text x="470.0" y="552.4" font-size="12" text-anchor="middle" fill="#ffffff">UART/GPIO/SGPIO/I2C</text><line x1="302.0" y1="541" x2="338.0" y2="541" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="640.0" y="496" width="260.0" height="90" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="770.0" y="529.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">AST1700</text><text x="770.0" y="544.6" font-size="12" text-anchor="middle" fill="#111827">MCTP over I2C x10 / I3C x16</text><text x="770.0" y="560.2" font-size="12" text-anchor="middle" fill="#111827">PWM x8, TACH x16, ADC x16</text><line x1="602.0" y1="541" x2="638.0" y2="541" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="940.0" y="496" width="260.0" height="90" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1070.0" y="529.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">More INTC1 instances</text><text x="1070.0" y="544.6" font-size="12" text-anchor="middle" fill="#111827">Linux binding: up to two</text><text x="1070.0" y="560.2" font-size="12" text-anchor="middle" fill="#111827">via LTPI</text><line x1="902.0" y1="541" x2="938.0" y2="541" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="40" y="612" font-size="12" text-anchor="start" fill="#111827">Linux's AST2700 interrupt binding says two further INTC1 instances 'may be attached ... via LTPI' - the expander use case.</text><text x="12" y="690" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Sources: aspeedtech.com AST2600/AST2700/AST1700 pages; OCP LTPI Rev 1.2 Figs. 1-2; Linux aspeed,ast2700-interrupt.yaml.</text></svg>

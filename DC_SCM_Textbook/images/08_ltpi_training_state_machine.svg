<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">LTPI link training and initialization state machine</title><desc id="d">State machine with Link Detect, Link Speed, Advertise, Configure and Accept, and Operational states and the conditions between them.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1240" height="720" fill="#ffffff"/><text x="620.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">LTPI link training and initialization state machine</text><rect x="20" y="44" width="380" height="200" rx="10" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="60" font-size="12" text-anchor="start" fill="#dc2626" font-weight="700">Link Training  (25 MHz base, SDR)</text><rect x="40" y="80" width="160" height="70" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="120.0" y="103.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Link Detect</text><text x="120.0" y="118.6" font-size="12" text-anchor="middle" fill="#111827">K28.5 frames</text><text x="120.0" y="134.2" font-size="12" text-anchor="middle" fill="#111827">align + DC balance</text><rect x="220" y="80" width="160" height="70" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="300.0" y="103.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Link Speed</text><text x="300.0" y="118.6" font-size="12" text-anchor="middle" fill="#111827">K28.5 frames</text><text x="300.0" y="134.2" font-size="12" text-anchor="middle" fill="#111827">pick common speed</text><line x1="200" y1="115" x2="220" y2="115" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><text x="40" y="180" font-size="11" text-anchor="start" fill="#111827">to leave Link Detect: (&gt;=255 Detect frames sent AND</text><text x="40" y="196" font-size="11" text-anchor="start" fill="#111827">&gt;=7 received) OR 1 Link Speed frame received</text><text x="40" y="216" font-size="11" text-anchor="start" fill="#111827">Frame alignment: frame start found AND 3 frames with good CRC</text><rect x="420" y="44" width="400" height="200" rx="10" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="6 4"/><text x="430" y="60" font-size="12" text-anchor="start" fill="#d97706" font-weight="700">Link Configuration  (operational clock)</text><rect x="440" y="80" width="170" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="525.0" y="103.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Advertise</text><text x="525.0" y="118.6" font-size="12" text-anchor="middle" fill="#111827">K28.6 frames</text><text x="525.0" y="134.2" font-size="12" text-anchor="middle" fill="#111827">send capabilities</text><rect x="630" y="60" width="170" height="56" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="715.0" y="83.80000000000001" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Configure (SCM)</text><text x="715.0" y="99.4" font-size="12" text-anchor="middle" fill="#111827">31-32 frames max*</text><rect x="630" y="124" width="170" height="56" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="715.0" y="147.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Accept (HPM)</text><text x="715.0" y="163.4" font-size="12" text-anchor="middle" fill="#111827">15 frames max</text><line x1="610" y1="105" x2="630" y2="90" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><line x1="610" y1="125" x2="630" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><text x="440" y="200" font-size="11" text-anchor="start" fill="#111827">enter Advertise after the PLL relocks (1 ms wait); need</text><text x="440" y="216" font-size="11" text-anchor="start" fill="#111827">3 correct frames in; alignment timeout 100 ms</text><rect x="840" y="44" width="380" height="200" rx="10" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="850" y="60" font-size="12" text-anchor="start" fill="#16a34a" font-weight="700">Link Operational</text><rect x="860" y="80" width="340" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="1030.0" y="110.80000000000001" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Operational</text><text x="1030.0" y="126.4" font-size="12" text-anchor="middle" fill="#111827">K28.7 IO frames + interleaved Data frames</text><text x="860" y="180" font-size="11" text-anchor="start" fill="#111827">matching Accept received: SCM sends its first Operational</text><text x="860" y="196" font-size="11" text-anchor="start" fill="#111827">frame; HPM leaves Accept on receiving an Operational frame</text><line x1="380" y1="115" x2="440" y2="115" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><line x1="800" y1="88" x2="858" y2="108" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><line x1="800" y1="152" x2="858" y2="122" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><text x="40" y="232" font-size="11" text-anchor="start" fill="#dc2626" font-weight="700">Link Lost or timeout in any state returns here (Link Detect).</text><text x="20" y="300" font-size="14" text-anchor="start" fill="#111827" font-weight="700">Transitions in the specification's Figure 28</text><rect x="20" y="322" width="290" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="348.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Link Speed -&gt; Advertise</text><text x="324" y="340" font-size="11" text-anchor="start" fill="#111827">SCM: &gt;=7 Link Speed frames sent (counted after receiving 1 from the HPM). HPM: &gt;=3 Link Speed frames received. Operational frequency</text><text x="324" y="356" font-size="11" text-anchor="start" fill="#111827">applied.</text><rect x="20" y="376" width="290" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="402.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Advertise -&gt; Configure/Accept</text><text x="324" y="394" font-size="11" text-anchor="start" fill="#111827">SCM selects a configuration (auto or BMC-selected) and sends Configure; HPM answers with Accept carrying the same capabilities.</text><rect x="20" y="430" width="290" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="456.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Configure -&gt; Advertise</text><text x="324" y="448" font-size="11" text-anchor="start" fill="#111827">no matching Accept within the Configure limit (text says 32, Table 43 says 31): SCM falls back to Advertise.</text><rect x="20" y="484" width="290" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="510.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Any training state -&gt; Link Detect</text><text x="324" y="502" font-size="11" text-anchor="start" fill="#111827">timeout or Link Lost error; physical reset or Link Retraining Request (CSR) also restarts training.</text><rect x="20" y="538" width="290" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="564.6" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Operational -&gt; Link Detect</text><text x="324" y="556" font-size="11" text-anchor="start" fill="#111827">Link Lost after 3 consecutive IO frames with CRC errors, even if good Data frames are interleaved (LTPI 1.1+).</text><rect x="20" y="592" width="290" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="618.6" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">When training runs</text><text x="324" y="610" font-size="11" text-anchor="start" fill="#111827">after power loss, after reset de-assert, on BMC request, and after a Link Lost error.</text><text x="20" y="666" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Why it exists: both ends must agree on frame alignment, speed and enabled channels before any GPIO, UART or I2C traffic is tunneled.</text><text x="12" y="710" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Source: OCP DC-SCM LTPI Spec Rev 1.2 (v1.0 RC3), section 4, Figs. 28-35, Tables 37-47. Check against the final published revision.</text></svg>

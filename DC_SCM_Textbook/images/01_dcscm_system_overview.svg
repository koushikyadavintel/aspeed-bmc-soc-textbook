<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">DC-SCM system view: host module (HPM) and control module (SCM) across the DC-SCI</title><desc id="d">Block diagram of an OCP DC-SCM 2.x system showing the HPM with CPU, FPGA, FRU and PSU, the DC-SCI connector with signal families, and the SCM with BMC, CPLD, flash, RoT and TPM.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1240" height="700" fill="#ffffff"/><text x="620.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">DC-SCM system view: host module (HPM) and control module (SCM) across the DC-SCI</text><rect x="20" y="44" width="420" height="560" rx="10" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="60" font-size="12" text-anchor="start" fill="#2563eb" font-weight="700">HPM  -  Host Processor Module (motherboard side)</text><rect x="36" y="78" width="388" height="78" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="230.0" y="112.80000000000001" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">CPU / chipset  (host domain)</text><text x="230.0" y="128.4" font-size="12" text-anchor="middle" fill="#111827">S0 powered; eSPI, QSPI, PCIe, PECI</text><rect x="36" y="164" width="388" height="78" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="230.0" y="191.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">HPM FPGA / CPLD</text><text x="230.0" y="206.6" font-size="12" text-anchor="middle" fill="#111827">power + reset sequencing, LTPI target,</text><text x="230.0" y="222.2" font-size="12" text-anchor="middle" fill="#111827">serializes IOs to the BMC</text><rect x="36" y="250" width="388" height="78" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="230.0" y="284.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">HPM FRU EEPROM</text><text x="230.0" y="300.4" font-size="12" text-anchor="middle" fill="#111827">on I2C0 at address 0xA0, not behind a mux</text><rect x="36" y="336" width="388" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="230.0" y="370.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">OCP NIC(s)</text><text x="230.0" y="386.4" font-size="12" text-anchor="middle" fill="#111827">NC-SI sideband to the BMC</text><rect x="36" y="422" width="388" height="78" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="230.0" y="456.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">PSU 12 V AUX + eFuse</text><text x="230.0" y="472.4" font-size="12" text-anchor="middle" fill="#111827">P12V_HPM_AUX -&gt; P12V_SCM_AUX</text><rect x="36" y="508" width="388" height="78" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="230.0" y="542.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Fans, sensors, VRs, front panel</text><text x="230.0" y="558.4" font-size="12" text-anchor="middle" fill="#111827">I2C/I3C, SGPIO, GPIO</text><rect x="800" y="44" width="420" height="560" rx="10" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="810" y="60" font-size="12" text-anchor="start" fill="#16a34a" font-weight="700">DC-SCM  -  Datacenter Secure Control Module</text><rect x="816" y="78" width="388" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="1010.0" y="112.80000000000001" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">BMC SoC</text><text x="1010.0" y="128.4" font-size="12" text-anchor="middle" fill="#111827">e.g. AST2600 / AST2700 class</text><rect x="816" y="164" width="388" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="1010.0" y="198.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">SCM CPLD / FPGA</text><text x="1010.0" y="214.4" font-size="12" text-anchor="middle" fill="#111827">glue logic, LTPI controller, muxes</text><rect x="816" y="250" width="388" height="78" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="1010.0" y="284.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">BMC flash x2 + BIOS flash x2</text><text x="1010.0" y="300.4" font-size="12" text-anchor="middle" fill="#111827">BIOS flash is read by the HPM via QSPI</text><rect x="816" y="336" width="388" height="78" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="1010.0" y="370.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">RoT security processor (optional)</text><text x="1010.0" y="386.4" font-size="12" text-anchor="middle" fill="#111827">attests BMC, BIOS and other firmware</text><rect x="816" y="422" width="388" height="78" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="1010.0" y="456.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">TPM (optional)</text><text x="1010.0" y="472.4" font-size="12" text-anchor="middle" fill="#111827">SPI TPM; dual-node adds TPM SPI buses</text><rect x="816" y="508" width="388" height="78" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="1010.0" y="542.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Front/rear I/O + SCM AUX VRs</text><text x="1010.0" y="558.4" font-size="12" text-anchor="middle" fill="#111827">RJ45, USB, video, UART; powers SCM from 12 V</text><rect x="500" y="44" width="240" height="560" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="620" y="70" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">DC-SCI</text><text x="620" y="88" font-size="11" text-anchor="middle" fill="#e5e7eb">SFF-TA-1002 4C+ , 168 pins</text><rect x="512" y="104" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="122.3" font-size="11" text-anchor="middle" fill="#111827">PCIe x1, x1, x4 (up to Gen5)</text><rect x="512" y="142" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="160.29999999999998" font-size="11" text-anchor="middle" fill="#111827">USB 2.0 / 3.1</text><rect x="512" y="180" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="198.29999999999998" font-size="11" text-anchor="middle" fill="#111827">eSPI (no LPC)</text><rect x="512" y="218" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="236.29999999999998" font-size="11" text-anchor="middle" fill="#111827">QSPI + SPI TPM + SPI</text><rect x="512" y="256" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="274.3" font-size="11" text-anchor="middle" fill="#111827">NC-SI RBT (up to 2)</text><rect x="512" y="294" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="312.3" font-size="11" text-anchor="middle" fill="#111827">I2C / I3C / FSI</text><rect x="512" y="332" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="350.3" font-size="11" text-anchor="middle" fill="#111827">UART x2</text><rect x="512" y="370" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="388.3" font-size="11" text-anchor="middle" fill="#111827">PECI</text><rect x="512" y="408" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="426.3" font-size="11" text-anchor="middle" fill="#111827">JTAG</text><rect x="512" y="446" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="464.3" font-size="11" text-anchor="middle" fill="#111827">SGPIO + GPIO</text><rect x="512" y="484" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="502.3" font-size="11" text-anchor="middle" fill="#111827">LTPI: 8 LVDS pins</text><rect x="512" y="522" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="540.3000000000001" font-size="11" text-anchor="middle" fill="#111827">12 V power + 3.3 V FRU rail</text><rect x="512" y="560" width="216" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="620.0" y="578.3000000000001" font-size="11" text-anchor="middle" fill="#111827">Presence + STBY handshake</text><line x1="424" y1="117" x2="500" y2="117" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="740" y1="117" x2="816" y2="117" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="424" y1="203" x2="500" y2="203" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="740" y1="203" x2="816" y2="203" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="424" y1="289" x2="500" y2="289" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="740" y1="289" x2="816" y2="289" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="424" y1="375" x2="500" y2="375" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="740" y1="375" x2="816" y2="375" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="424" y1="461" x2="500" y2="461" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="740" y1="461" x2="816" y2="461" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="424" y1="547" x2="500" y2="547" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="740" y1="547" x2="816" y2="547" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="20" y="636" font-size="12" text-anchor="start" fill="#111827">Roles: the HPM is the thing being managed; the SCM holds the BMC and security parts so one design can serve many motherboards.</text><text x="20" y="656" font-size="12" text-anchor="start" fill="#111827">'Plug-and-Code': extra HPM-specific behaviour lives in BMC firmware, SCM CPLD and HPM FPGA images, not in the connector.</text><text x="12" y="690" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Based on OCP DC-SCM Specification Rev 2.1 v1.1, Fig. 1 concept and sections 1.1, 3.4-3.6. Not an OCP document.</text></svg>

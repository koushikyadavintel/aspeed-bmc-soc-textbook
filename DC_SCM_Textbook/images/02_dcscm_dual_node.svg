<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">DC-SCM dual-node concept: one SCM managing two hosts</title><desc id="d">Dual node block diagram: one BMC and SCM CPLD connected to two HPM nodes with dedicated PCIe, eSPI, QSPI and PECI per node and low speed signals tunneled over LTPI.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1200" height="640" fill="#ffffff"/><text x="600.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">DC-SCM dual-node concept: one SCM managing two hosts</text><rect x="20" y="44" width="380" height="540" rx="10" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="30" y="60" font-size="12" text-anchor="start" fill="#16a34a" font-weight="700">DC-SCM</text><rect x="40" y="80" width="340" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="210.0" y="113.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">BMC</text><text x="210.0" y="128.6" font-size="12" text-anchor="middle" fill="#111827">needs per-node eSPI/PECI/QSPI paths</text><text x="210.0" y="144.2" font-size="12" text-anchor="middle" fill="#111827">(spec: not every BMC has dual eSPI)</text><rect x="40" y="190" width="340" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="210.0" y="223.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">SCM CPLD</text><text x="210.0" y="238.6" font-size="12" text-anchor="middle" fill="#111827">LTPI controller, TPM and flash muxing</text><text x="210.0" y="254.2" font-size="12" text-anchor="middle" fill="#111827">consolidates low-speed signals</text><rect x="40" y="300" width="160" height="84" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="120.0" y="337.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">BIOS flash</text><text x="120.0" y="353.4" font-size="12" text-anchor="middle" fill="#111827">QSPI0 / QSPI1</text><rect x="220" y="300" width="160" height="84" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="300.0" y="337.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">BMC flash</text><text x="300.0" y="353.4" font-size="12" text-anchor="middle" fill="#111827">SPI</text><rect x="40" y="400" width="160" height="84" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="120.0" y="430.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">TPM 0</text><text x="120.0" y="445.6" font-size="12" text-anchor="middle" fill="#111827">SPI (2.1: primary</text><text x="120.0" y="461.2" font-size="12" text-anchor="middle" fill="#111827">dual-node TPM SPIs)</text><rect x="220" y="400" width="160" height="84" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="300.0" y="430.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">TPM 1</text><text x="300.0" y="445.6" font-size="12" text-anchor="middle" fill="#111827">SPI, or QSPI with</text><text x="300.0" y="461.2" font-size="12" text-anchor="middle" fill="#111827">a dedicated chip select</text><rect x="40" y="500" width="340" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="210.0" y="525.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">RoT</text><text x="210.0" y="541.4" font-size="12" text-anchor="middle" fill="#111827">JTAG / SPI, per design</text><rect x="430" y="44" width="340" height="540" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="600" y="72" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">DC-SCI (dual-node pinout)</text><rect x="446" y="90" width="308" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="600.0" y="109.15" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">LTPI (LVDS)</text><text x="600.0" y="123.45" font-size="11" text-anchor="middle" fill="#111827">shared: tunnels GPIO, UART, I2C, data</text><rect x="446" y="144" width="308" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="600.0" y="163.14999999999998" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">PCIe0 / USB0</text><text x="600.0" y="177.45" font-size="11" text-anchor="middle" fill="#111827">node 0 host-domain PCIe x1</text><rect x="446" y="198" width="308" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="600.0" y="217.14999999999998" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">PCIe1 / USB1</text><text x="600.0" y="231.45" font-size="11" text-anchor="middle" fill="#111827">node 1 host-domain PCIe x1</text><rect x="446" y="252" width="308" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="600.0" y="271.15" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">eSPI0 + eSPI1</text><text x="600.0" y="285.45" font-size="11" text-anchor="middle" fill="#111827">two full eSPI interfaces</text><rect x="446" y="306" width="308" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="600.0" y="325.15" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">QSPI0 + QSPI1</text><text x="600.0" y="339.45" font-size="11" text-anchor="middle" fill="#111827">BIOS flash per node</text><rect x="446" y="360" width="308" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="600.0" y="379.15" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">PECI0 + PECI1</text><text x="600.0" y="393.45" font-size="11" text-anchor="middle" fill="#111827">per-node CPU health</text><rect x="446" y="414" width="308" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="600.0" y="433.15" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">PERST_P0_N / P1_N</text><text x="600.0" y="447.45" font-size="11" text-anchor="middle" fill="#111827">per-node PCIe reset</text><rect x="446" y="468" width="308" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="600.0" y="487.15" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">NC-SI x2</text><text x="600.0" y="501.45" font-size="11" text-anchor="middle" fill="#111827">optional per node</text><rect x="446" y="522" width="308" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="600.0" y="541.1500000000001" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">I2C: 6x 3.3 V + 3x 1.8 V</text><text x="600.0" y="555.45" font-size="11" text-anchor="middle" fill="#111827">bus numbers not continuous</text><rect x="800" y="44" width="380" height="250" rx="10" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="810" y="60" font-size="12" text-anchor="start" fill="#2563eb" font-weight="700">HPM node 0</text><rect x="820" y="80" width="340" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="990.0" y="105.80000000000001" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">CPU 0 + chipset 0</text><text x="990.0" y="121.4" font-size="12" text-anchor="middle" fill="#111827">PCIe(x1), eSPI, PECI, QSPI</text><rect x="820" y="150" width="340" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="990.0" y="175.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">HPM FPGA / CPLD (LTPI target)</text><text x="990.0" y="191.4" font-size="12" text-anchor="middle" fill="#111827">drawn once in spec Fig. 2</text><rect x="820" y="220" width="340" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="990.0" y="245.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">FRU on I2C0 at 0xA0</text><text x="990.0" y="261.40000000000003" font-size="12" text-anchor="middle" fill="#111827">required, not behind a mux</text><rect x="800" y="320" width="380" height="264" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4"/><text x="810" y="336" font-size="12" text-anchor="start" fill="#7c3aed" font-weight="700">HPM node 1</text><rect x="820" y="356" width="340" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="990.0" y="381.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">CPU 1 + chipset 1</text><text x="990.0" y="397.4" font-size="12" text-anchor="middle" fill="#111827">PCIe(x1), eSPI, PECI, QSPI</text><rect x="820" y="426" width="340" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="990.0" y="451.79999999999995" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">NIC / NC-SI (second interface)</text><text x="990.0" y="467.4" font-size="12" text-anchor="middle" fill="#111827">redundancy or per-node use</text><rect x="820" y="496" width="340" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="990.0" y="521.8" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Dedicated pins per node,</text><text x="990.0" y="537.4" font-size="12" text-anchor="middle" fill="#111827">common management via LTPI</text><line x1="380" y1="120" x2="428" y2="120" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="380" y1="280" x2="428" y2="280" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="380" y1="440" x2="428" y2="440" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="772" y1="160" x2="798" y2="160" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="772" y1="440" x2="798" y2="440" stroke="#374151" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="20" y="612" font-size="12" text-anchor="start" fill="#111827">Spec intent: scale beyond two nodes later by moving low-speed interfaces onto LTPI and freeing pins for dedicated per-node buses.</text><text x="12" y="630" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Based on OCP DC-SCM Rev 2.1 v1.1 section 1.2 and Fig. 2, Table 6.</text></svg>

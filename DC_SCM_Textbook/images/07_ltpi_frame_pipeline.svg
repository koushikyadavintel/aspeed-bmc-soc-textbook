<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="1240" height="740" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">LTPI: how GPIO, UART, I2C and data channels share one LVDS link</title><desc id="d">Diagram showing LTPI channels combined by time-division multiplexing into frames, protected by CRC, 8b/10b encoded, and serialized over LVDS, plus a frame time table.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1240" height="740" fill="#ffffff"/><text x="620.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">LTPI: how GPIO, UART, I2C and data channels share one LVDS link</text><rect x="20" y="56" width="260" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="150.0" y="71.0" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">GPIO channel</text><text x="150.0" y="85.3" font-size="11" text-anchor="middle" fill="#111827">LL GPIO: 1 bit in every frame</text><text x="150.0" y="99.6" font-size="11" text-anchor="middle" fill="#111827">NL GPIO: spread over N frames</text><rect x="20" y="114" width="260" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="150.0" y="129.0" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">I2C/SMBus channel</text><text x="150.0" y="143.3" font-size="11" text-anchor="middle" fill="#111827">event based, up to 6 buses</text><text x="150.0" y="157.6" font-size="11" text-anchor="middle" fill="#111827">clock stretching while syncing</text><rect x="20" y="172" width="260" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="150.0" y="187.0" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">UART channel</text><text x="150.0" y="201.3" font-size="11" text-anchor="middle" fill="#111827">3x oversampled; 2 UARTs</text><text x="150.0" y="215.6" font-size="11" text-anchor="middle" fill="#111827">TXD/RXD samples per frame</text><rect x="20" y="230" width="260" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="150.0" y="252.14999999999998" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">OEM channel</text><text x="150.0" y="266.45" font-size="11" text-anchor="middle" fill="#111827">vendor-defined bits</text><rect x="20" y="288" width="260" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="150.0" y="303.0" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">Data channel</text><text x="150.0" y="317.3" font-size="11" text-anchor="middle" fill="#111827">random-access reads/writes</text><text x="150.0" y="331.6" font-size="11" text-anchor="middle" fill="#111827">to memory-mapped space</text><line x1="280" y1="190" x2="330" y2="190" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="330" y="120" width="170" height="140" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/><text x="415.0" y="170.20000000000002" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Channel</text><text x="415.0" y="185.8" font-size="12" text-anchor="middle" fill="#111827">controller</text><text x="415.0" y="201.40000000000003" font-size="12" text-anchor="middle" fill="#111827">TDM into one</text><text x="415.0" y="217.00000000000003" font-size="12" text-anchor="middle" fill="#111827">LTPI frame</text><line x1="500" y1="190" x2="540" y2="190" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="540" y="140" width="120" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="600.0" y="178.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">CRC</text><text x="600.0" y="193.6" font-size="12" text-anchor="middle" fill="#111827">no inversion,</text><text x="600.0" y="209.2" font-size="12" text-anchor="middle" fill="#111827">no reflection</text><line x1="660" y1="190" x2="700" y2="190" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="700" y="140" width="140" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="770.0" y="178.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">8b/10b</text><text x="770.0" y="193.6" font-size="12" text-anchor="middle" fill="#111827">encode + comma</text><text x="770.0" y="209.2" font-size="12" text-anchor="middle" fill="#111827">symbol K28.x</text><line x1="840" y1="190" x2="880" y2="190" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="880" y="120" width="160" height="140" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="960.0" y="178.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">LVDS serializer</text><text x="960.0" y="193.6" font-size="12" text-anchor="middle" fill="#111827">DATA pair + CLK pair</text><text x="960.0" y="209.2" font-size="12" text-anchor="middle" fill="#111827">SDR or DDR</text><line x1="1040" y1="190" x2="1080" y2="190" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1080" y="140" width="140" height="100" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="1150.0" y="178.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">to the other</text><text x="1150.0" y="193.6" font-size="12" text-anchor="middle" fill="#111827">CPLD / FPGA</text><text x="1150.0" y="209.2" font-size="12" text-anchor="middle" fill="#111827">RX path mirrors TX</text><text x="330" y="300" font-size="12" text-anchor="start" fill="#111827" font-weight="700">A frame is always 16 symbols = 160 bits after 8b/10b, including the comma symbol.</text><text x="20" y="372" font-size="14" text-anchor="start" fill="#111827" font-weight="700">Frame types (distinguished by comma symbol)</text><rect x="20" y="388" width="90" height="32" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="65.0" y="407.59999999999997" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">K28.5</text><text x="124" y="402" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Link Detect and Link Speed Selection</text><text x="124" y="418" font-size="11" text-anchor="start" fill="#111827">DC balance, speed capability exchange, select speed</text><rect x="20" y="428" width="90" height="32" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="65.0" y="447.59999999999997" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">K28.6</text><text x="124" y="442" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Advertise / Configure / Accept</text><text x="124" y="458" font-size="11" text-anchor="start" fill="#111827">exchange and enable supported channels and features</text><rect x="20" y="468" width="90" height="32" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="65.0" y="487.59999999999997" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">K28.7</text><text x="124" y="482" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Operational frame</text><text x="124" y="498" font-size="11" text-anchor="start" fill="#111827">normal traffic; carries every supported channel</text><text x="20" y="540" font-size="14" text-anchor="start" fill="#111827" font-weight="700">Frame transfer time = 160 bit-times / (clock x rate), rate = 1 for SDR, 2 for DDR (spec Table 7 matches this)</text><rect x="20" y="556" width="210" height="28" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="125.0" y="573.6" font-size="12" text-anchor="middle" fill="#ffffff">LTPI clock (MHz)</text><rect x="240" y="556" width="120" height="28" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="300.0" y="573.6" font-size="12" text-anchor="middle" fill="#ffffff">25</text><rect x="370" y="556" width="120" height="28" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="430.0" y="573.6" font-size="12" text-anchor="middle" fill="#ffffff">50</text><rect x="500" y="556" width="120" height="28" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="560.0" y="573.6" font-size="12" text-anchor="middle" fill="#ffffff">100</text><rect x="630" y="556" width="120" height="28" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="690.0" y="573.6" font-size="12" text-anchor="middle" fill="#ffffff">200</text><rect x="760" y="556" width="120" height="28" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="820.0" y="573.6" font-size="12" text-anchor="middle" fill="#ffffff">400</text><rect x="890" y="556" width="120" height="28" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="950.0" y="573.6" font-size="12" text-anchor="middle" fill="#ffffff">1000</text><rect x="20" y="588" width="210" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="125.0" y="605.6" font-size="12" text-anchor="middle" fill="#111827">SDR frame time (us)</text><rect x="240" y="588" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="300.0" y="605.6" font-size="12" text-anchor="middle" fill="#111827">6.40</text><rect x="370" y="588" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="430.0" y="605.6" font-size="12" text-anchor="middle" fill="#111827">3.20</text><rect x="500" y="588" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="560.0" y="605.6" font-size="12" text-anchor="middle" fill="#111827">1.60</text><rect x="630" y="588" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="690.0" y="605.6" font-size="12" text-anchor="middle" fill="#111827">0.80</text><rect x="760" y="588" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="820.0" y="605.6" font-size="12" text-anchor="middle" fill="#111827">0.40</text><rect x="890" y="588" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="950.0" y="605.6" font-size="12" text-anchor="middle" fill="#111827">0.16</text><rect x="20" y="620" width="210" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="125.0" y="637.6" font-size="12" text-anchor="middle" fill="#111827">DDR frame time (us)</text><rect x="240" y="620" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="300.0" y="637.6" font-size="12" text-anchor="middle" fill="#111827">3.20</text><rect x="370" y="620" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="430.0" y="637.6" font-size="12" text-anchor="middle" fill="#111827">1.60</text><rect x="500" y="620" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="560.0" y="637.6" font-size="12" text-anchor="middle" fill="#111827">0.80</text><rect x="630" y="620" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="690.0" y="637.6" font-size="12" text-anchor="middle" fill="#111827">0.40</text><rect x="760" y="620" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="820.0" y="637.6" font-size="12" text-anchor="middle" fill="#111827">0.20</text><rect x="890" y="620" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="950.0" y="637.6" font-size="12" text-anchor="middle" fill="#111827">0.08</text><text x="20" y="684" font-size="12" text-anchor="start" fill="#111827">Training always starts at the 25 MHz base frequency in SDR mode; the operational speed is negotiated afterward.</text><text x="20" y="704" font-size="12" text-anchor="start" fill="#111827">Example in the spec: HPM supports 25/100/250 MHz and SCM supports 25/50/75/100 MHz with DDR, so they select 100 MHz DDR.</text><text x="12" y="730" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Source: OCP DC-SCM LTPI Spec Rev 1.2 (v1.0 RC3) sections 1.2, 2.1-2.2, 3, Tables 5-7, 19.</text></svg>

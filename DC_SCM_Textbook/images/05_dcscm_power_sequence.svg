<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="1240" height="740" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">DC-SCM power states, presence detect and discovery sequence</title><desc id="d">Ladder of G3, pre-STBY, STBY, S5 and S0 states showing the eleven discovery steps and the key power and presence signals.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1240" height="740" fill="#ffffff"/><text x="620.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">DC-SCM power states, presence detect and discovery sequence</text><rect x="20" y="50" width="124" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="82.0" y="72.5" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">G3</text><rect x="20" y="90" width="124" height="200" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="28" y="114" font-size="11" text-anchor="start" fill="#111827">No PSU input</text><text x="28" y="136" font-size="11" text-anchor="start" fill="#111827">only the coin</text><text x="28" y="158" font-size="11" text-anchor="start" fill="#111827">cell has bias</text><rect x="150" y="50" width="384" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="342.0" y="72.5" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">Pre-STBY</text><rect x="150" y="90" width="384" height="200" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="158" y="114" font-size="11" text-anchor="start" fill="#111827">1 PSU delivers P12V_HPM_AUX</text><text x="158" y="136" font-size="11" text-anchor="start" fill="#111827">2 SCM fully seated -&gt; eFuse enables 12 V AUX</text><text x="158" y="158" font-size="11" text-anchor="start" fill="#111827">3 SCM AUX VRs regulate (incl. 3.3 V FRU rail)</text><text x="158" y="180" font-size="11" text-anchor="start" fill="#111827">4 BMC boots (RoT first if present), reads HPM FRU,</text><text x="158" y="202" font-size="11" text-anchor="start" fill="#111827">   optional crypto authentication</text><text x="158" y="224" font-size="11" text-anchor="start" fill="#111827">5 compatibility OK -&gt; SCM asserts HPM_STBY_EN</text><rect x="540" y="50" width="244" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="662.0" y="72.5" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">STBY</text><rect x="540" y="90" width="244" height="200" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="548" y="114" font-size="11" text-anchor="start" fill="#111827">6 HPM asserts HPM_STBY_RDY</text><text x="548" y="136" font-size="11" text-anchor="start" fill="#111827">   (all HPM AUX rails in regulation)</text><text x="548" y="158" font-size="11" text-anchor="start" fill="#111827">7 SCM releases HPM_STBY_RST_N</text><rect x="790" y="50" width="274" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="927.0" y="72.5" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">S5</text><rect x="790" y="90" width="274" height="200" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="798" y="114" font-size="11" text-anchor="start" fill="#111827">8 S5-class interfaces may engage</text><text x="798" y="136" font-size="11" text-anchor="start" fill="#111827">9 SCM lets HPM FPGA release host</text><text x="798" y="158" font-size="11" text-anchor="start" fill="#111827">   (e.g. RSM_RST_N / AUXPWROK); host OFF</text><text x="798" y="180" font-size="11" text-anchor="start" fill="#111827">10 wake requests wait for BMC grant</text><rect x="1070" y="50" width="144" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="1142.0" y="72.5" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">S0</text><rect x="1070" y="90" width="144" height="200" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="1078" y="114" font-size="11" text-anchor="start" fill="#111827">11 BMC grants power-on;</text><text x="1078" y="136" font-size="11" text-anchor="start" fill="#111827">HPM CPLD sequences</text><text x="1078" y="158" font-size="11" text-anchor="start" fill="#111827">host to S0</text><text x="20" y="372" font-size="14" text-anchor="start" fill="#111827" font-weight="700">Signals (Table 12)</text><rect x="20" y="386" width="260" height="32" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="150.0" y="405.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">PRSNT0_N / PRSNT1_N</text><text x="292" y="407" font-size="12" text-anchor="start" fill="#111827">3.3 V presence pair; pull-up on HPM enables power to SCM; must be tied together on the SCM</text><rect x="20" y="424" width="260" height="32" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="150.0" y="443.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">HPM_STBY_EN (SCM out)</text><text x="292" y="445" font-size="12" text-anchor="start" fill="#111827">active high: all SCM STBY rails good; enables HPM STBY rails</text><rect x="20" y="462" width="260" height="32" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="150.0" y="481.59999999999997" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">HPM_STBY_RDY (HPM out)</text><text x="292" y="483" font-size="12" text-anchor="start" fill="#111827">active high: HPM STBY sequence complete; 2.1 adds guidance for FPGA readiness</text><rect x="20" y="500" width="260" height="32" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="150.0" y="519.6" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">HPM_STBY_RST_N (SCM out)</text><text x="292" y="521" font-size="12" text-anchor="start" fill="#111827">active low: holds HPM standby devices in reset until the SCM releases it</text><text x="20" y="560" font-size="14" text-anchor="start" fill="#111827" font-weight="700">Electrical numbers (Table 14, 15)</text><text x="20" y="584" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Input voltage:</text><text x="330" y="584" font-size="12" text-anchor="start" fill="#111827">10.8 V min, 12 V nominal, 13.2 V max</text><text x="20" y="606" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Max current / S5 power:</text><text x="330" y="606" font-size="12" text-anchor="start" fill="#111827">4.4 A (1.1 A per pin x 4 pins); 10.8 V x 4.4 A = 47.52 W</text><text x="20" y="628" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Recommended limit below S5 and in STBY:</text><text x="330" y="628" font-size="12" text-anchor="start" fill="#111827">15 W unless the HPM is known to support the full SCM limit</text><text x="20" y="650" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Inrush rise time:</text><text x="330" y="650" font-size="12" text-anchor="start" fill="#111827">5 ms min to 200 ms max</text><text x="20" y="672" font-size="12" text-anchor="start" fill="#111827" font-weight="700">VCC_SCM_HPM_FRU:</text><text x="330" y="672" font-size="12" text-anchor="start" fill="#111827">3.3 V AUX +/-5% (3.135-3.465 V), 200 mA max = 0.627 W; new in DC-SCI 2</text><text x="20" y="712" font-size="12" text-anchor="start" fill="#111827" font-weight="700">Plug-N-Detect-Else-Halt: if the HPM FRU is incompatible or missing, the SCM must halt the boot sequence. No hot plug is specified.</text><text x="12" y="730" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Source: OCP DC-SCM Rev 2.1 v1.1 section 3.6 (Tables 12-13, Fig. 63-64) and section 4.1.</text></svg>

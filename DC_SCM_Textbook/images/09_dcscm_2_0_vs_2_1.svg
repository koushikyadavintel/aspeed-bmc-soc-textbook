<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 780" width="1260" height="780" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">DC-SCM 2.0 versus 2.1 (and the LTPI spec that rides along)</title><desc id="d">Timeline of DC-SCM 2.0, 2.1 and LTPI revisions and a four-column summary of what changed from 2.0 to 2.1.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1260" height="780" fill="#ffffff"/><text x="630.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">DC-SCM 2.0 versus 2.1 (and the LTPI spec that rides along)</text><line x1="40" y1="130" x2="1220" y2="130" stroke="#111827" stroke-width="3"/><rect x="52" y="122" width="16" height="16" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="60" y="112" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Dec 2020</text><rect x="292" y="122" width="16" height="16" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="300" y="112" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Jul 27 2022</text><rect x="552" y="122" width="16" height="16" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="560" y="112" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Oct 2023</text><rect x="782" y="122" width="16" height="16" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="790" y="112" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Nov 2023</text><rect x="992" y="122" width="16" height="16" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="1000" y="112" font-size="12" text-anchor="middle" fill="#111827" font-weight="700">Apr-Jun 2024</text><rect x="40" y="150" width="230" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="155.0" y="186.14999999999998" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">2.0 (Dec 2020)</text><text x="155.0" y="200.45" font-size="11" text-anchor="middle" fill="#111827">initial public review</text><rect x="280" y="150" width="230" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="395.0" y="186.14999999999998" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">2.0 v1.0 (Jul 2022)</text><text x="395.0" y="200.45" font-size="11" text-anchor="middle" fill="#111827">first release; LTPI 1.0</text><rect x="520" y="150" width="240" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="640.0" y="179.0" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">2.1 v1.0 (Oct 2023)</text><text x="640.0" y="193.3" font-size="11" text-anchor="middle" fill="#111827">VFF, JTAG naming fix,</text><text x="640.0" y="207.6" font-size="11" text-anchor="middle" fill="#111827">FRU fields; LTPI 1.1</text><rect x="770" y="150" width="220" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="880.0" y="186.14999999999998" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">2.1 v1.1 (Nov 2023)</text><text x="880.0" y="200.45" font-size="11" text-anchor="middle" fill="#111827">FRU record version 0001b</text><rect x="1000" y="150" width="220" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="1110.0" y="186.14999999999998" font-size="11" text-anchor="middle" fill="#111827" font-weight="700">2.1 edits (2024)</text><text x="1110.0" y="200.45" font-size="11" text-anchor="middle" fill="#111827">bias, USB, NC-SI, STBY_RDY</text><text x="40" y="258" font-size="12" text-anchor="start" fill="#111827">LTPI revision 1.2 (Aug 11 2025) was published separately; the copy read here is 'Version 1.0 RC3'. LTPI versions independently of DC-SCM.</text><rect x="24" y="290" width="296" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="172.0" y="311.2" font-size="14" text-anchor="middle" fill="#111827" font-weight="700">Mechanical</text><rect x="24" y="328" width="296" height="290" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="34" y="352" font-size="11" text-anchor="start" fill="#111827">+ Vertical Form Factor (short and long),</text><text x="34" y="378" font-size="11" text-anchor="start" fill="#111827">   Type 1/2 brackets, optional rear bracket</text><text x="34" y="404" font-size="11" text-anchor="start" fill="#111827">+ chamfer dimensions (Fig. 4)</text><text x="34" y="430" font-size="11" text-anchor="start" fill="#111827">+ bottom standoff keep-out dimensions</text><text x="34" y="456" font-size="11" text-anchor="start" fill="#111827">+ optional IFF handle dimensions</text><text x="34" y="482" font-size="11" text-anchor="start" fill="#111827">+ chassis opening and I/O region terms</text><text x="34" y="508" font-size="11" text-anchor="start" fill="#111827">= HFF still 1.57 mm PCB, same 4C+</text><rect x="328" y="290" width="296" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="476.0" y="311.2" font-size="14" text-anchor="middle" fill="#111827" font-weight="700">Signals and power</text><rect x="328" y="328" width="296" height="290" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="338" y="352" font-size="11" text-anchor="start" fill="#111827">JTAG TDI/TDO naming and direction now</text><text x="338" y="378" font-size="11" text-anchor="start" fill="#111827">   follow IEEE 1149.1 (1.0 and 2.0 did not)</text><text x="338" y="404" font-size="11" text-anchor="start" fill="#111827">+ dual-node SPI TPM buses on the SCM</text><text x="338" y="430" font-size="11" text-anchor="start" fill="#111827">SGPIO timing now per DC-MHS M-PIC</text><text x="338" y="456" font-size="11" text-anchor="start" fill="#111827">'Pre-S5' renamed STBY</text><text x="338" y="482" font-size="11" text-anchor="start" fill="#111827">early-power-state requirement relaxed</text><text x="338" y="508" font-size="11" text-anchor="start" fill="#111827">+ LVDS Rtt guidance, USB termination notes</text><text x="338" y="534" font-size="11" text-anchor="start" fill="#111827">+ HPM_STBY_RDY guidance for FPGA readiness</text><rect x="632" y="290" width="296" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="780.0" y="311.2" font-size="14" text-anchor="middle" fill="#111827" font-weight="700">Discovery and FRU</text><rect x="632" y="328" width="296" height="290" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="642" y="352" font-size="11" text-anchor="start" fill="#111827">FRU record format version: 0000b = 2.0,</text><text x="642" y="378" font-size="11" text-anchor="start" fill="#111827">   0001b = 2.1</text><text x="642" y="404" font-size="11" text-anchor="start" fill="#111827">+ HPM Vendor ID (offset 0x10) and</text><text x="642" y="430" font-size="11" text-anchor="start" fill="#111827">   HPM Device ID (offset 0x12)</text><text x="642" y="456" font-size="11" text-anchor="start" fill="#111827">+ LTPI least-supported revision/version</text><text x="642" y="482" font-size="11" text-anchor="start" fill="#111827">OEM FRU data starts at byte 32 if used</text><text x="642" y="508" font-size="11" text-anchor="start" fill="#111827">all FRU offsets written in hex</text><rect x="936" y="290" width="296" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="1084.0" y="311.2" font-size="14" text-anchor="middle" fill="#111827" font-weight="700">Documents</text><rect x="936" y="328" width="296" height="290" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="946" y="352" font-size="11" text-anchor="start" fill="#111827">LTPI introduction removed from the base</text><text x="946" y="378" font-size="11" text-anchor="start" fill="#111827">   spec; LTPI lives in its own spec</text><text x="946" y="404" font-size="11" text-anchor="start" fill="#111827">MIPI I3C reference removed from 3.5.7</text><text x="946" y="430" font-size="11" text-anchor="start" fill="#111827">NC-SI timing section trimmed to DC-SCM only</text><text x="946" y="456" font-size="11" text-anchor="start" fill="#111827">pinout summary table replaced by</text><text x="946" y="482" font-size="11" text-anchor="start" fill="#111827">   single/dual-node pinout diagrams</text><text x="946" y="508" font-size="11" text-anchor="start" fill="#111827">text now says 'DC-SCM 2' for the family</text><rect x="24" y="640" width="1210" height="70" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="629.0" y="670.8" font-size="12" text-anchor="middle" fill="#111827">Not changed (no revision-history entry): SFF-TA-1002 4C+ 168-pin connector, 3.25 mm key shift versus OCP NIC 3.0,</text><text x="629.0" y="686.4" font-size="12" text-anchor="middle" fill="#111827">LTPI on 8 LVDS pins, 12 V input range, STBY handshake. Both 2.0 and 2.1 are mechanically incompatible with DC-SCM 1.0 cards.</text><text x="24" y="734" font-size="11" text-anchor="start" fill="#111827">Legend: + added or extended in 2.1, = carried over. Derived from the 2.1 revision-history table; verify wording against the PDF.</text><text x="12" y="770" font-size="10" text-anchor="start" fill="#6b7280" font-style="italic">Original diagram. Source: OCP DC-SCM Rev 2.1 v1.1 revision history, sections 2.2-2.3, 3.4-3.6, 6.1; LTPI Rev 1.2 revision history.</text></svg>
